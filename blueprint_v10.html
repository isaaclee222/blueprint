<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — Smart Building Sketch v0.3.8</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@500;600;700&display=swap');

  :root{
    --paper:#F7F5EE;
    --ink:#1B2A4A;
    --accent:#2B6CB0;
    --interior:#2E7D6B;
    --handle:#D93025;
    --invalid:#9AA0A6;
    --chrome:#E8E5DC;
    --chrome-dark:#CFCBBF;
    --chrome-light:#FBFAF5;
    --grid-minor:#DDE4EC;
    --grid-major:#C5D0DE;
    font-size:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:#B9B4A6;}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:14px;
  }
  #app{
    width:100%; height:100%;
    max-width:1400px;
    display:flex; flex-direction:column;
    background:var(--chrome);
    border:1px solid #8f8a7c;
    border-radius:6px;
    box-shadow:0 12px 40px rgba(27,42,74,.35), inset 0 1px 0 var(--chrome-light);
    overflow:hidden;
  }
  /* ---------- title bar ---------- */
  #titlebar{
    display:flex; align-items:center; gap:10px;
    padding:7px 12px;
    background:linear-gradient(#F2EFE6,#E2DED2);
    border-bottom:1px solid var(--chrome-dark);
    user-select:none;
  }
  #titlebar .logo{
    width:18px; height:18px; border-radius:4px;
    background:var(--ink);
    display:grid; place-items:center;
    color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  }
  #titlebar .name{font-weight:600; color:var(--ink); font-size:.95rem;}
  #titlebar .file{font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:#6f6a5c;}
  #titlebar .ver{
    margin-left:auto; font-family:'IBM Plex Mono',monospace;
    font-size:.72rem; color:#8a8574; letter-spacing:.05em;
  }
  /* ---------- toolbar ---------- */
  #toolbar{
    display:flex; align-items:center; gap:4px; flex-wrap:wrap;
    padding:6px 8px;
    background:var(--chrome);
    border-bottom:1px solid var(--chrome-dark);
    user-select:none;
  }
  .tb-sep{width:1px; align-self:stretch; margin:2px 5px; background:var(--chrome-dark); box-shadow:1px 0 0 var(--chrome-light);}
  button.tb{
    appearance:none; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    padding:6px 10px;
    font-family:'Archivo',sans-serif; font-size:.82rem; font-weight:600;
    color:var(--ink);
    background:linear-gradient(var(--chrome-light),var(--chrome));
    border:1px solid var(--chrome-dark);
    border-radius:4px;
    box-shadow:inset 0 1px 0 #fff, 0 1px 0 rgba(0,0,0,.06);
  }
  button.tb:hover{background:linear-gradient(#fff,var(--chrome-light));}
  button.tb:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.15); background:var(--chrome);}
  button.tb.active{
    background:var(--ink); color:var(--paper);
    border-color:var(--ink);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.35);
  }
  button.tb.active.int{background:var(--interior); border-color:var(--interior);}
  button.tb:disabled{opacity:.4; cursor:default;}
  button.tb .key{
    font-family:'IBM Plex Mono',monospace; font-size:.65rem; font-weight:500;
    padding:1px 4px; border-radius:3px;
    background:rgba(27,42,74,.08); color:inherit; opacity:.75;
  }
  button.tb.active .key{background:rgba(247,245,238,.18);}
  button.tb svg{width:15px; height:15px; flex:none;}
  .paint-select{
    appearance:none; cursor:pointer;
    max-width:150px;
    padding:6px 24px 6px 9px;
    font-family:'Archivo',sans-serif; font-size:.78rem; font-weight:600;
    color:var(--ink);
    background:linear-gradient(var(--chrome-light),var(--chrome));
    border:1px solid var(--chrome-dark); border-radius:4px;
    box-shadow:inset 0 1px 0 #fff, 0 1px 0 rgba(0,0,0,.06);
  }
  #paintPanel{display:flex; align-items:center; gap:4px;}
  #stairTypes,#doorTypes,#windowTypes{display:none; align-items:center; gap:4px;}
  #stairTypes.show,#doorTypes.show,#windowTypes.show{display:flex;}
  /* ---------- canvas ---------- */
  #canvaswrap{position:relative; flex:1; min-height:0; background:var(--paper);}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair;}
  canvas.tool-select{cursor:default;}
  canvas.tool-erase{cursor:cell;}
  canvas.panning{cursor:grabbing;}
  /* ---------- floor selector ---------- */
  #floorPanel{
    position:absolute; right:14px; bottom:14px;
    display:flex; flex-direction:column; gap:4px;
    background:var(--chrome);
    border:1px solid var(--chrome-dark);
    border-radius:6px;
    padding:6px;
    box-shadow:0 4px 14px rgba(27,42,74,.22), inset 0 1px 0 var(--chrome-light);
    user-select:none;
  }
  #floorPanel .fp-title{
    font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.08em;
    color:#8a8574; text-align:center; padding-bottom:2px;
  }
  #floorPanel button{
    appearance:none; cursor:pointer;
    min-width:64px;
    padding:6px 10px;
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; font-weight:600;
    color:var(--ink);
    background:linear-gradient(var(--chrome-light),var(--chrome));
    border:1px solid var(--chrome-dark); border-radius:4px;
  }
  #floorPanel button:hover{background:linear-gradient(#fff,var(--chrome-light));}
  #floorPanel button.cur{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  #floorPanel button.add{color:#6f6a5c; font-weight:500;}
  /* ---------- status bar ---------- */
  #statusbar{
    display:flex; align-items:center; gap:14px;
    padding:5px 12px;
    background:linear-gradient(var(--chrome),#DAD6C9);
    border-top:1px solid var(--chrome-dark);
    font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:#4a4a3f;
    user-select:none; white-space:nowrap; overflow:hidden;
  }
  #tip{flex:1; overflow:hidden; text-overflow:ellipsis;}
  #tip b{color:var(--ink);}
  #tip.warn{color:var(--handle); font-weight:600;}
  #coords,#zoom,#floorInd{color:#77725f;}
  @media (max-width:860px){
    button.tb .lbl{display:none;}
    #coords{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="logo">▦</div>
    <span class="name">Blueprint</span>
    <span class="file">untitled.plan</span>
    <span class="ver">SMART BUILDING · PROTOTYPE 0.3.10</span>
  </div>

  <div id="toolbar">
    <button class="tb tool" data-tool="select" title="Select / move walls (V)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M4 2l8 7-3.5.5L10 13l-2 1-1.5-3.5L4 12V2z" fill="currentColor"/></svg>
      <span class="lbl">Select</span><span class="key">V</span>
    </button>
    <button class="tb tool" data-tool="wall" title="Draw exterior walls (W)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 13h11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><rect x="1" y="11.5" width="3" height="3" fill="currentColor"/><rect x="11" y="11.5" width="3" height="3" fill="currentColor"/></svg>
      <span class="lbl">Wall</span><span class="key">W</span>
    </button>
    <button class="tb tool int" data-tool="interior" title="Draw half walls — thin, waist-high in 3D (I)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 13h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 2"/><rect x="1" y="12" width="2.4" height="2.4" fill="currentColor"/><rect x="11.6" y="12" width="2.4" height="2.4" fill="currentColor"/></svg>
      <span class="lbl">Half wall</span><span class="key">I</span>
    </button>
    <button class="tb tool" data-tool="door" title="Place doors (D)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 14h12M4 14V3h5v11" stroke="currentColor" stroke-width="1.6"/><path d="M9 3a8 8 0 015 7" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/></svg>
      <span class="lbl">Door</span><span class="key">D</span>
    </button>
    <button class="tb tool" data-tool="stairs" title="Place stairs (S)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 14h3v-3h3V8h3V5h3V2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Stairs</span><span class="key">S</span>
    </button>
    <button class="tb tool" data-tool="cutout" title="Cut a floor opening for stairs / lofts (C)">
      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M5 5l6 6M11 5l-6 6" stroke="currentColor" stroke-width="1.3"/></svg>
      <span class="lbl">Cutout</span><span class="key">C</span>
    </button>
    <button class="tb tool" data-tool="pillar" title="Place rectangular support pillars (P)">
      <svg viewBox="0 0 16 16" fill="none"><rect x="4" y="3" width="8" height="10" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 3h11M2.5 13h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="lbl">Pillar</span><span class="key">P</span>
    </button>
    <button class="tb tool" data-tool="erase" title="Erase (E)">
      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="7" width="7" height="6" rx="1" transform="rotate(-25 5 10)" stroke="currentColor" stroke-width="1.6"/><path d="M8 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="lbl">Erase</span><span class="key">E</span>
    </button>

    <div class="tb-sep"></div>

    <div id="stairTypes">
      <button class="tb st" data-st="straight" title="Straight, skinny (1.0 × 3.0 m)"><span class="lbl">Straight</span></button>
      <button class="tb st" data-st="wide" title="Straight, wide (1.6 × 3.0 m)"><span class="lbl">Wide</span></button>
      <button class="tb st" data-st="uturn" title="180° switchback with landing (2.0 × 2.6 m)"><span class="lbl">U-turn</span></button>
      <div class="tb-sep"></div>
    </div>

    <div id="doorTypes">
      <button class="tb dt" data-door="single" title="Single door (0.9 m)"><span class="lbl">Single</span></button>
      <button class="tb dt" data-door="double" title="Double doors (1.8 m)"><span class="lbl">Double</span></button>
      <div class="tb-sep"></div>
    </div>

    <button class="tb" id="btnWindows" title="Toggle windows on the selected wall (N)" disabled>
      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v10M2 8h12" stroke="currentColor" stroke-width="1.2"/></svg>
      <span class="lbl">Windows</span><span class="key">N</span>
    </button>
    <div id="windowTypes">
      <button class="tb wt" data-win="standard" title="Standard window"><span class="lbl">Std</span></button>
      <button class="tb wt" data-win="tall" title="Taller window"><span class="lbl">Tall</span></button>
      <button class="tb wt" data-win="wide" title="Double-wide window"><span class="lbl">Wide</span></button>
      <button class="tb wt" data-win="tallWide" title="Tall double-wide window"><span class="lbl">Tall wide</span></button>
    </div>

    <div class="tb-sep"></div>

    <button class="tb" id="btnSnap" title="Snap to grid (G)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 1v14M8 1v14M13 1v14M1 3h14M1 8h14M1 13h14" stroke="currentColor" stroke-width="1"/></svg>
      <span class="lbl">Snap</span><span class="key">G</span>
    </button>

    <div class="tb-sep"></div>

    <button class="tb" id="btnUndo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M6 3L2 7l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 7h8a4 4 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="lbl">Undo</span>
    </button>
    <button class="tb" id="btnRedo" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M10 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 7H6a4 4 0 000 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="lbl">Redo</span>
    </button>

    <div class="tb-sep"></div>

    <button class="tb" id="btnJson" title="Download the plan as JSON (for the future 3D translator)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l-3-3m3 3l3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12v2h12v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="lbl">Export JSON</span>
    </button>
    <button class="tb" id="btnObj" title="Export the whole building as a Wavefront .obj (open in Blender)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5l5.5 3v7l-5.5 3-5.5-3v-7l5.5-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2.5 4.5L8 7.5l5.5-3M8 7.5V14" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span class="lbl">Export OBJ</span>
    </button>
    <button class="tb" id="btnPbr" title="Download the Blender script that extracts full PBR ZIPs and wires material nodes automatically">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 3h10v10H3z" stroke="currentColor" stroke-width="1.4"/><path d="M5 6h6M5 8h6M5 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="lbl">PBR ZIPs</span>
    </button>
    <button class="tb" id="btnPng" title="Save a PNG snapshot of the blueprint">
      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="6" r="1.4" fill="currentColor"/><path d="M2 11l3.5-3 3 2.5L12 7l2 2" stroke="currentColor" stroke-width="1.4"/></svg>
      <span class="lbl">PNG</span>
    </button>

    <div class="tb-sep"></div>

    <div id="paintPanel" title="Prototype material slots for OBJ/MTL export">
      <select id="paintTarget" class="paint-select" aria-label="Paint target"></select>
      <select id="paintMaterial" class="paint-select" aria-label="Material"></select>
      <button class="tb" id="btnApplyPaint" title="Apply this material globally, or to the selected wall/room when possible"><span class="lbl">Paint</span></button>
    </div>

    <div class="tb-sep"></div>

    <button class="tb" id="btnClear" title="Clear this floor">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V2.5h4V4M4.5 4l.8 9h5.4l.8-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="lbl">Clear floor</span>
    </button>
  </div>

  <div id="canvaswrap">
    <canvas id="cv"></canvas>
    <div id="floorPanel">
      <div class="fp-title">FLOORS</div>
      <div id="floorBtns"></div>
      <button class="add" id="btnAddFloor">+ floor</button>
    </div>
  </div>

  <div id="statusbar">
    <span id="tip"></span>
    <span id="floorInd">F1</span>
    <span id="coords">0.0, 0.0 m</span>
    <span id="zoom">100%</span>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   Blueprint — smart building sketch prototype v0.3
   World units are meters. Grid cell = 0.5 m.
   All walls are orthogonal (horizontal or vertical).
   v0.3: rooms own their walls (walls carry a roomId, rooms
   are fully separated — shared boundaries are two coincident
   walls), room-aware erase, and Wavefront .obj export.
========================================================= */
const GRID = 0.5;
const MAJOR = 2.5;
const WALL_T = 0.14;        // exterior wall visual thickness (m)
const INT_T = 0.09;         // interior wall visual thickness (m)
const WIN_LEN = 1.5;
const WIN_GAP = 1.2;
const WIN_MARGIN = 0.9;
const DOOR_W = 0.9;
const DOUBLE_DOOR_W = 1.8;
const PILLAR_W = 0.28;
const PILLAR_D = 0.28;
const DOOR_TYPES = {
  single: {w: DOOR_W, label: 'SINGLE'},
  double: {w: DOUBLE_DOOR_W, label: 'DOUBLE'},
};
const WINDOW_TYPES = {
  standard: {length: WIN_LEN, sill: 0.9, height: 1.4, label: 'STD'},
  tall:     {length: WIN_LEN, sill: 0.45, height: 2.1, label: 'TALL'},
  wide:     {length: 3.0, sill: 0.9, height: 1.4, label: 'WIDE'},
  tallWide: {length: 3.0, sill: 0.45, height: 2.1, label: 'TALL WIDE'},
};

const MATERIALS = {
  Exterior_Brick:              {label:'Exterior brick',        cat:['exteriorWall'], kd:[0.50,0.20,0.14], rough:0.88},
  Exterior_Stylized_Concrete:  {label:'Stylized concrete',     cat:['exteriorWall','interiorWall','roof','trim'], kd:[0.48,0.48,0.43], rough:0.92},
  Interior_Drywall_Warm:       {label:'Drywall warm',          cat:['interiorWall','ceiling'], kd:[0.76,0.73,0.66], rough:0.80},
  Interior_Drywall_White:      {label:'Drywall white',         cat:['interiorWall','ceiling'], kd:[0.86,0.84,0.78], rough:0.78},
  Interior_Drywall_BlueGray:   {label:'Drywall blue-gray',     cat:['interiorWall','ceiling'], kd:[0.48,0.54,0.57], rough:0.82},
  Interior_Brick:              {label:'Interior brick',        cat:['interiorWall'], kd:[0.45,0.18,0.12], rough:0.90},
  Interior_Plain_Concrete:     {label:'Plain concrete',        cat:['interiorWall','floor','ceiling','roof','pillar','stair','trim'], kd:[0.42,0.42,0.39], rough:0.95},
  Interior_Wallpaper_Muted:    {label:'Muted wallpaper',       cat:['interiorWall'], kd:[0.52,0.47,0.41], rough:0.76},
  Interior_Marble:             {label:'Wall marble',           cat:['interiorWall'], kd:[0.72,0.70,0.66], rough:0.35},
  Ceiling_Tiles:               {label:'Ceiling tiles',         cat:['ceiling','interiorWall'], kd:[0.70,0.69,0.64], rough:0.86},
  Floor_Wood_Dark:             {label:'Dark wood floor',       cat:['floor'], kd:[0.30,0.19,0.11], rough:0.55},
  Floor_Carpet_Charcoal:       {label:'Carpet charcoal',       cat:['floor'], kd:[0.15,0.16,0.16], rough:0.98},
  Floor_Carpet_Brown:          {label:'Carpet dark brown',     cat:['floor'], kd:[0.23,0.17,0.13], rough:0.98},
  Floor_Carpet_BlueGray:       {label:'Carpet blue-gray',      cat:['floor'], kd:[0.20,0.25,0.29], rough:0.98},
  Floor_Tile_Slate:            {label:'Slate tile',            cat:['floor'], kd:[0.25,0.27,0.28], rough:0.60},
  Floor_Marble_Gray:           {label:'Gray marble floor',     cat:['floor'], kd:[0.62,0.61,0.58], rough:0.38},
  Floor_Concrete:              {label:'Concrete floor',        cat:['floor'], kd:[0.44,0.44,0.41], rough:0.92},
  Roof_Concrete:               {label:'Concrete roof',         cat:['roof'], kd:[0.36,0.37,0.35], rough:0.96},
  Trim_Foundation_Concrete:    {label:'Concrete foundation',   cat:['trim'], kd:[0.34,0.34,0.31], rough:0.94},
  Trim_Wood_Paneling:          {label:'Wood paneling',         cat:['trim'], kd:[0.28,0.16,0.09], rough:0.65},
  Pillar_Concrete:             {label:'Concrete pillar',       cat:['pillar'], kd:[0.43,0.43,0.40], rough:0.94},
  Stair_Concrete:              {label:'Concrete stairs',       cat:['stair'], kd:[0.39,0.39,0.36], rough:0.92},
  Door_Wood:                   {label:'Wood doors',            cat:['door'], kd:[0.32,0.18,0.08], rough:0.55},
  Window_Glass:                {label:'Glass placeholder',     cat:['glass'], kd:[0.55,0.72,0.80], rough:0.10, alpha:0.35},
  Cut_Edge_Concrete:           {label:'Cut edge concrete',     cat:['edge'], kd:[0.40,0.40,0.37], rough:0.94},
};

const TEXTURE_SOURCES = {
  Exterior_Brick:             {asset:'Bricks038',         source:'ambientCG', file:'Exterior_Brick_BaseColor.jpg',             url:'https://ambientcg.com/view?id=Bricks038'},
  Exterior_Stylized_Concrete: {asset:'Concrete023',       source:'ambientCG', file:'Exterior_Stylized_Concrete_BaseColor.jpg', url:'https://ambientcg.com/view?id=Concrete023'},
  Interior_Drywall_Warm:      {asset:'PaintedPlaster003', source:'ambientCG', file:'Interior_Drywall_BaseColor.jpg',           url:'https://ambientcg.com/view?id=PaintedPlaster003'},
  Interior_Drywall_White:     {asset:'PaintedPlaster003', source:'ambientCG', file:'Interior_Drywall_BaseColor.jpg',           url:'https://ambientcg.com/view?id=PaintedPlaster003'},
  Interior_Drywall_BlueGray:  {asset:'PaintedPlaster003', source:'ambientCG', file:'Interior_Drywall_BaseColor.jpg',           url:'https://ambientcg.com/view?id=PaintedPlaster003'},
  Interior_Brick:             {asset:'Bricks023',         source:'ambientCG', file:'Interior_Brick_BaseColor.jpg',             url:'https://ambientcg.com/view?id=Bricks023'},
  Interior_Plain_Concrete:    {asset:'Concrete023',       source:'ambientCG', file:'Interior_Plain_Concrete_BaseColor.jpg',    url:'https://ambientcg.com/view?id=Concrete023'},
  Interior_Wallpaper_Muted:   {asset:'Fabric022',         source:'ambientCG', file:'Interior_Wallpaper_Muted_BaseColor.jpg',   url:'https://ambientcg.com/view?id=Fabric022'},

    if (!targets.has(w.id)) targets.set(w.id, {wall:w, intervals:[]});
    targets.get(w.id).intervals.push(iv);
    if (!targets.has(o.id)) targets.set(o.id, {wall:o, intervals:[]});
    targets.get(o.id).intervals.push(iv);
  }
  for (const {wall, intervals} of targets.values()) cutWallByAxisIntervals(wall, intervals);
}

// walls of *other* rooms that sit on top of this wall = a shared room-to-room boundary
function sharedBoundaryWalls(w){
  return walls.filter(o => o.fl === w.fl && o.id !== w.id &&
    roomOf(o) !== roomOf(w) && wallsCollinearOverlap(w, o));
}
function exactSharedCounterpartWalls(w){
  const A = wallAxisInfo(w);
  if (!A) return [];
  return sharedBoundaryWalls(w).filter(o => {
    const B = wallAxisInfo(o);
    if (!B || !sameWallLine(w, o)) return false;
    return Math.abs(A.lo - B.lo) < 0.04 && Math.abs(A.hi - B.hi) < 0.04;
  });
}
function stairRect(st){ // world-space AABB of a stair (rot swaps w/h)
  const t = STAIR_TYPES[st.type];
  const swap = st.rot % 180 !== 0;
  const w = swap ? t.h : t.w, h = swap ? t.w : t.h;
  return {x0: st.cx - w/2, y0: st.cy - h/2, x1: st.cx + w/2, y1: st.cy + h/2};
}
function pillarRect(p){
  const w = p.w || PILLAR_W, d = p.d || PILLAR_D;
  return {x0:p.cx - w/2, y0:p.cy - d/2, x1:p.cx + w/2, y1:p.cy + d/2};
}
function roomContainsOrTouchesPoint(r, p, tol = 0.16){
  if (pointInPoly(p, r.pts)) return true;
  const b = bbox(r.pts);
  return p.x >= b.x0 - tol && p.x <= b.x1 + tol && p.y >= b.y0 - tol && p.y <= b.y1 + tol;
}

/* ---------------- undo ---------------- */
function snapshot(){ return JSON.stringify({walls, rooms, doors, stairs, cutouts, pillars, ids, nFloors, defaultMats, foundationTrimOn}); }
function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0;
  syncButtons();
}
function restore(json){
  const s = JSON.parse(json);
  walls = s.walls || []; rooms = s.rooms || []; doors = s.doors || [];
  stairs = s.stairs || []; cutouts = s.cutouts || []; pillars = s.pillars || []; ids = s.ids; nFloors = s.nFloors;
  if (curFl > nFloors) curFl = nFloors;
  sel = null; ghost = null; stairGhost = null; pillarGhost = null;
  buildFloorPanel(); syncButtons(); draw();
}
function undo(){ if (undoStack.length){ redoStack.push(snapshot()); restore(undoStack.pop()); } }
function redo(){ if (redoStack.length){ undoStack.push(snapshot()); restore(redoStack.pop()); } }

function warn(msg){
  tipEl.classList.add('warn');
  tipEl.innerHTML = msg;
  clearTimeout(warnTimer);
  warnTimer = setTimeout(() => { tipEl.classList.remove('warn'); tipEl.innerHTML = TIPS[tool]; }, 2200);
}

/* ---------------- mutations ---------------- */
function addWall(a, b, kind){
  // Blueprint tracing mode is permissive: intentional overlapping / coincident
  // walls are allowed, and the OBJ exporter is responsible for culling exact
  // duplicate hidden faces. This makes hallways and unusual real plans easier
  // to sketch without fighting the editor.
  pushUndo();
  walls.push({id: ids++, fl: curFl, kind, x1:a.x, y1:a.y, x2:b.x, y2:b.y, windows:false, roomId:null});
}
function extrudePts(w, d){
  const n = nrm(w);
  const p1 = {x:w.x1, y:w.y1}, p2 = {x:w.x2, y:w.y2};
  return [p1, p2, {x:p2.x + n.x*d, y:p2.y + n.y*d}, {x:p1.x + n.x*d, y:p1.y + n.y*d}];
}
function extrudeValid(w, d){
  // Real blueprints often need odd hallway/room overlaps while tracing. Allow
  // the sketch operation and let export-time slab/wall de-duplication clean up
  // the final mesh as much as possible.
  return true;
}
/* Each room owns its own complete set of 4 walls (roomId), so rooms are fully
   separated: moving one room never reshapes a neighbour. If the extrude base
   wall is freestanding it's adopted by the new room; if it already belongs to
   another room, the new room gets its own coincident copy (the shared boundary
   is then two stacked walls — the .obj exporter merges them into one solid). */
function extrudeRoom(w, d){
  if (!extrudeValid(w, d)){ warn('Rooms can’t overlap an existing room.'); return; }
  pushUndo();
  const [p1, p2, p3, p4] = extrudePts(w, d);
  const kind = w.kind;
  const roomId = ids++;
  if (roomOf(w) === null) w.roomId = roomId;
  else walls.push({id: ids++, fl: curFl, kind, x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, windows:false, roomId});
  walls.push({id: ids++, fl: curFl, kind, x1:p2.x, y1:p2.y, x2:p3.x, y2:p3.y, windows:false, roomId});
  walls.push({id: ids++, fl: curFl, kind, x1:p3.x, y1:p3.y, x2:p4.x, y2:p4.y, windows:false, roomId});
  walls.push({id: ids++, fl: curFl, kind, x1:p4.x, y1:p4.y, x2:p1.x, y2:p1.y, windows:false, roomId});
  rooms.push({id: roomId, fl: curFl, pts: [p1, p2, p3, p4], name: 'Room ' + (flRooms().length + 1)});
}
function removeWallsById(idSet){ // no pushUndo here — callers snapshot first
  walls = walls.filter(w => !idSet.has(w.id));
  doors = doors.filter(d => !idSet.has(d.wallId));
  if (idSet.has(sel)) sel = null;
}
/* Erase rules for a single wall:
   - delete the exact wall segment you clicked/selected
   - if another room has an exact coincident duplicate of the same span, remove
     that duplicate too so a shared wall can become a clean opening
   - longer neighbouring walls are never broadly cut by accident */
function tryEraseWall(w){
  if (!w) return false;
  pushUndo();
  const idSet = new Set([w.id]);
  for (const o of exactSharedCounterpartWalls(w)) idSet.add(o.id);
  removeWallsById(idSet);
  return true;
}
/* Erase a room and everything in it: its walls, their doors,
   and any stairs / cutouts sitting inside its footprint. */
function eraseRoom(r){
  pushUndo();
  const wallIds = new Set(walls.filter(w => w.roomId === r.id).map(w => w.id));
  removeWallsById(wallIds);
  stairs = stairs.filter(s => !(s.fl === r.fl && pointInPoly({x:s.cx, y:s.cy}, r.pts)));
  cutouts = cutouts.filter(c => !(c.fl === r.fl && pointInPoly({x:c.x + c.w/2, y:c.y + c.h/2}, r.pts)));
  pillars = pillars.filter(p => !(p.fl === r.fl && roomContainsOrTouchesPoint(r, {x:p.cx, y:p.cy})));
  rooms = rooms.filter(x => x.id !== r.id);
}
function doorValid(g){
  const w = walls.find(x => x.id === g.wallId);
  if (!w) return false;
  const dw = doorWidth(g);
  if (len(w) < dw + 0.2) return false;
  const s0 = g.s - dw/2, s1 = g.s + dw/2;
  return !doorSpans(w).some(([a, b]) => s1 > a + 0.02 && s0 < b - 0.02);
}
function placeDoor(g){
  if (!doorValid(g)){ warn('Doors can’t overlap another door.'); return; }
  pushUndo();
  doors.push({id: ids++, fl: curFl, wallId: g.wallId, s: g.s, side: g.side, hinge: g.hinge, type: g.type || doorType, width: doorWidth(g)});
}
function placePillar(p){
  const hit = flPillars().some(o => Math.hypot(o.cx - p.cx, o.cy - p.cy) < 0.05);
  if (hit){ warn('A pillar is already on that grid point.'); return; }
  pushUndo();
  pillars.push({id: ids++, fl: curFl, cx: p.cx, cy: p.cy, w: p.w || PILLAR_W, d: p.d || PILLAR_D});
}

/* --- wall moving (Select tool) ---
   Body drag  = translate perpendicular to the wall (resizes the room it belongs to).
   Endpoint   = slide along the wall's own axis (lengthen / shorten).
   v0.3: rooms are fully separated — a body drag only carries along walls and
   corners of the SAME room (or, for freestanding walls, other freestanding
   walls sharing an endpoint). A neighbouring room's coincident wall stays put,
   so dragging one room never deforms another. */
function moveWallBody(w, delta){ // delta is perpendicular {x,y}
  const e1 = {x: w.x1, y: w.y1}, e2 = {x: w.x2, y: w.y2};
  // door world-positions on connected walls, to restore after stretch
  const affected = walls.filter(o => o.id !== w.id && o.fl === w.fl &&
    roomOf(o) === roomOf(w) &&
    (same({x:o.x1,y:o.y1}, e1) || same({x:o.x1,y:o.y1}, e2) ||
     same({x:o.x2,y:o.y2}, e1) || same({x:o.x2,y:o.y2}, e2)));
  const doorPos = new Map();
  for (const o of affected)
    for (const d of doors.filter(d => d.wallId === o.id))
      doorPos.set(d.id, ptAlong(o, d.s));
  // move coincident corners of this wall's own room only
  for (const r of rooms.filter(r => r.fl === w.fl && r.id === roomOf(w)))
    for (const p of r.pts)
      if (same(p, e1) || same(p, e2)){ p.x += delta.x; p.y += delta.y; }
  // move coincident wall endpoints
  for (const o of affected){
    if (same({x:o.x1,y:o.y1}, e1) || same({x:o.x1,y:o.y1}, e2)){ o.x1 += delta.x; o.y1 += delta.y; }
    if (same({x:o.x2,y:o.y2}, e1) || same({x:o.x2,y:o.y2}, e2)){ o.x2 += delta.x; o.y2 += delta.y; }
  }
  // move the wall itself
  w.x1 += delta.x; w.y1 += delta.y; w.x2 += delta.x; w.y2 += delta.y;
  // restore door positions on stretched walls
  for (const o of affected){
    const L = len(o);
    for (const d of doors.filter(d => d.wallId === o.id)){
      const p = doorPos.get(d.id);
      const u = dir(o);
      d.s = Math.max(doorWidth(d)/2 + 0.05, Math.min(L - doorWidth(d)/2 - 0.05,
        (p.x - o.x1)*u.x + (p.y - o.y1)*u.y));
    }
  }
}

/* ---------------- rendering ---------------- */
function resize(){
  const dpr = window.devicePixelRatio || 1;
  cv.width = wrap.clientWidth * dpr;
  cv.height = wrap.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
// line weights: scale with zoom but clamped so extremes never look weird
const wallPx = () => clamp(2.5, WALL_T * view.s, 8);
const intPx  = () => clamp(1.8, INT_T * view.s, 5.5);
const pxFor  = w => w.kind === 'interior' ? intPx() : wallPx();

function line(a, b){ ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }

function drawGrid(){
  const wpx = wrap.clientWidth, hpx = wrap.clientHeight;
  const x1 = Wd({x:wpx, y:hpx}).x, y1 = Wd({x:wpx, y:hpx}).y;
  const minorVisible = GRID * view.s >= 7;
  const step = minorVisible ? GRID : MAJOR;
  ctx.lineWidth = 1;
  for (let x = Math.floor(view.x/step)*step; x <= x1; x += step){
    const major = Math.abs(x / MAJOR - Math.round(x / MAJOR)) < 1e-6;
    ctx.strokeStyle = major ? C.gridMajor : C.gridMinor;
    const sx = S({x, y:0}).x;
    line({x:sx, y:0}, {x:sx, y:hpx});
  }
  for (let y = Math.floor(view.y/step)*step; y <= y1; y += step){
    const major = Math.abs(y / MAJOR - Math.round(y / MAJOR)) < 1e-6;
    ctx.strokeStyle = major ? C.gridMajor : C.gridMinor;
    const sy = S({x:0, y}).y;
    line({x:0, y:sy}, {x:wpx, y:sy});
  }
}

function drawFloorBelowGhost(){
  if (curFl <= 1) return;
  const fl = curFl - 1;
  ctx.save();
  ctx.globalAlpha = 0.28;
  // rooms as faint fills
  for (const r of rooms.filter(r => r.fl === fl)){
    ctx.beginPath();
    r.pts.forEach((p, i) => { const s = S(p); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
    ctx.closePath();
    ctx.fillStyle = 'rgba(27,42,74,.06)';
    ctx.fill();
  }
  // walls as grey lines
  for (const w of walls.filter(w => w.fl === fl)){
    ctx.strokeStyle = '#9aa2ad';
    ctx.lineWidth = pxFor(w);
    ctx.lineCap = 'butt';
    line(S({x:w.x1, y:w.y1}), S({x:w.x2, y:w.y2}));
  }
  // stairs outlines — critical for aligning cutouts
  for (const st of stairs.filter(s => s.fl === fl)) drawStair(st, true);
  for (const p of pillars.filter(p => p.fl === fl)) drawPillar(p, true);
  ctx.restore();
}

function drawRoom(r){
  ctx.beginPath();
  r.pts.forEach((p, i) => { const s = S(p); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
  ctx.closePath();
  ctx.fillStyle = 'rgba(43,108,176,.07)';
  ctx.fill();
  const cx = r.pts.reduce((a,p)=>a+p.x,0)/4, cy = r.pts.reduce((a,p)=>a+p.y,0)/4;
  const c = S({x:cx, y:cy});
  ctx.fillStyle = 'rgba(27,42,74,.55)';
  ctx.font = `600 ${clamp(10, view.s*0.28, 16)}px Archivo, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(r.name, c.x, c.y - 2);
  ctx.fillStyle = 'rgba(27,42,74,.4)';
  ctx.font = `500 ${clamp(9, view.s*0.22, 13)}px "IBM Plex Mono", monospace`;
  ctx.textBaseline = 'top';
  ctx.fillText(polyArea(r.pts).toFixed(1) + ' m²', c.x, c.y + 2);
}

function drawCutout(co, isGhost){
  const a = S({x:co.x, y:co.y}), b = S({x:co.x + co.w, y:co.y + co.h});
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  ctx.save();
  ctx.globalAlpha = isGhost ? 0.6 : 1;
  ctx.fillStyle = C.paper;
  ctx.fillRect(x, y, w, h);
  // diagonal hatch
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.strokeStyle = 'rgba(27,42,74,.22)';
  ctx.lineWidth = 1;
  const step = 9;
  for (let i = -h; i < w; i += step){
    ctx.beginPath();
    ctx.moveTo(x + i, y + h);
    ctx.lineTo(x + i + h, y);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = isGhost ? 0.6 : 1;
  ctx.strokeStyle = isGhost ? C.handle : 'rgba(27,42,74,.6)';
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1.4;
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
  if (w > 56 && h > 20){
    ctx.fillStyle = 'rgba(27,42,74,.45)';
    ctx.font = `500 ${clamp(8, view.s*0.18, 11)}px "IBM Plex Mono", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('OPEN TO BELOW', x + w/2, y + h/2);
  }
  ctx.globalAlpha = 1;
}

function drawStair(st, ghosted){
  const t = STAIR_TYPES[st.type];
  const c = S({x: st.cx, y: st.cy});
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(st.rot * Math.PI / 180);
  const w = t.w * view.s, h = t.h * view.s;
  const col = ghosted ? '#9aa2ad' : (st.invalid ? C.invalid : C.ink);
  ctx.globalAlpha = ghosted ? 0.35 : (st.ghost ? 0.6 : 1); // ghosted = floor-below grey; st.ghost = placement preview
  ctx.strokeStyle = st.ghost ? C.handle : col;
  ctx.lineWidth = 1.6;
  ctx.strokeRect(-w/2, -h/2, w, h);
  ctx.lineWidth = 1;
  const treadStep = 0.28 * view.s;
  if (st.type === 'uturn'){
    const land = t.landing * view.s;
    // center divider (stops at the landing)
    line({x:0, y:h/2}, {x:0, y:-h/2 + land});
    // landing divider
    line({x:-w/2, y:-h/2 + land}, {x:w/2, y:-h/2 + land});
    // treads on both flights
    for (let y = h/2 - treadStep; y > -h/2 + land; y -= treadStep){
      line({x:-w/2, y}, {x:0, y});
      line({x:0, y}, {x:w/2, y});
    }
    // arrow: up right flight, across landing, marker down-left implied
    arrow({x:w/4, y:h/2 - 4}, {x:w/4, y:-h/2 + land/2}, st.ghost ? C.handle : col);
    line({x:w/4, y:-h/2 + land/2}, {x:-w/4, y:-h/2 + land/2});
  } else {
    for (let y = h/2 - treadStep; y > -h/2 + treadStep*0.5; y -= treadStep){
      line({x:-w/2, y}, {x:w/2, y});
    }
    arrow({x:0, y:h/2 - 4}, {x:0, y:-h/2 + 8}, st.ghost ? C.handle : col);
  }
  if (h > 46){
    ctx.fillStyle = st.ghost ? C.handle : col;
    ctx.font = `600 ${clamp(7, view.s*0.16, 10)}px "IBM Plex Mono", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(st.type === 'uturn' ? -w/4 : 0, h/2 - 12);
    ctx.fillText('UP', 0, 0);
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function arrow(a, b, col){
  ctx.strokeStyle = col; ctx.lineWidth = 1.3;
  line(a, b);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 6*Math.cos(ang - 0.45), b.y - 6*Math.sin(ang - 0.45));
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 6*Math.cos(ang + 0.45), b.y - 6*Math.sin(ang + 0.45));
  ctx.stroke();
}

function drawPillar(p, ghosted){
  const r = pillarRect(p);
  const a = S({x:r.x0, y:r.y0}), b = S({x:r.x1, y:r.y1});
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  ctx.save();
  ctx.globalAlpha = ghosted ? 0.35 : (p.ghost ? 0.65 : 1);
  ctx.fillStyle = p.ghost ? 'rgba(217,48,37,.18)' : 'rgba(27,42,74,.22)';
  ctx.strokeStyle = p.ghost ? C.handle : C.ink;
  ctx.lineWidth = 1.6;
  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);
  if (w > 12 && h > 12){
    ctx.beginPath();
    ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + w - 3, y + h - 3);
    ctx.moveTo(x + w - 3, y + 3); ctx.lineTo(x + 3, y + h - 3);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWall(w){
  const a = S({x:w.x1, y:w.y1}), b = S({x:w.x2, y:w.y2});
  const px = pxFor(w);
  const isSel = sel === w.id;
  const baseCol = w.kind === 'interior' ? C.interior : C.ink;
  if (isSel){
    ctx.strokeStyle = 'rgba(43,108,176,.35)';
    ctx.lineWidth = px + 7; ctx.lineCap = 'round';
    line(a, b);
  }
  ctx.strokeStyle = isSel ? C.accent : baseCol;
  ctx.lineWidth = px; ctx.lineCap = 'butt';
  line(a, b);

  for (const sp of windowSpans(w)){
    const p0 = S(ptAlong(w, sp.s0)), p1 = S(ptAlong(w, sp.s1));
    ctx.strokeStyle = C.paper; ctx.lineWidth = px + 2;
    line(p0, p1);
    const nS = nrm(w);
    const t = w.kind === 'interior' ? INT_T : WALL_T;
    const off = o => s => ({x:s.x + nS.x*o*view.s, y:s.y + nS.y*o*view.s});
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.4;
    line(off(t*0.5)(p0), off(t*0.5)(p1));
    line(off(-t*0.5)(p0), off(-t*0.5)(p1));
    ctx.lineWidth = 1;
    line(p0, p1);
    ctx.lineWidth = 1.4;
    line(off(t*0.5)(p0), off(-t*0.5)(p0));
    line(off(t*0.5)(p1), off(-t*0.5)(p1));
  }

  for (const d of doors.filter(d => d.wallId === w.id)) drawDoor(w, d, false, true);

  if (isSel){
    ctx.fillStyle = C.accent;
    for (const p of [a, b]) ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
  }
}

function drawDoorLeaf(w, H, closedDir, side, leafW, col){
  const n = nrm(w);
  const openDir = {x:n.x * side, y:n.y * side};
  const T = {x: H.x + openDir.x * leafW, y: H.y + openDir.y * leafW};
  const O = {x: H.x + closedDir.x * leafW, y: H.y + closedDir.y * leafW};
  const Hs = S(H), Os = S(O), Ts = S(T);
  line(Hs, Ts);
  const a0 = Math.atan2(Os.y - Hs.y, Os.x - Hs.x);
  const a1 = Math.atan2(Ts.y - Hs.y, Ts.x - Hs.x);
  let sweep = a1 - a0;
  while (sweep <= -Math.PI) sweep += Math.PI * 2;
  while (sweep > Math.PI) sweep -= Math.PI * 2;
  ctx.beginPath();
  ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
  ctx.arc(Hs.x, Hs.y, leafW * view.s, a0, a1, sweep < 0);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(Hs.x, Hs.y, 2.5, 0, Math.PI*2); ctx.fill();
}
function drawDoor(w, d, isGhost, valid){
  const px = pxFor(w);
  const dw = doorWidth(d);
  const s0 = d.s - dw/2, s1 = d.s + dw/2;
  const p0 = S(ptAlong(w, s0)), p1 = S(ptAlong(w, s1));
  ctx.globalAlpha = isGhost ? 0.6 : 1;
  ctx.strokeStyle = C.paper; ctx.lineWidth = px + 2; ctx.lineCap = 'butt';
  line(p0, p1);
  const u = dir(w);
  const col = isGhost ? (valid ? C.handle : C.invalid) : (w.kind === 'interior' ? C.interior : C.ink);
  ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  if ((d.type || 'single') === 'double'){
    const half = dw / 2;
    drawDoorLeaf(w, ptAlong(w, s0), u, d.side, half, col);
    drawDoorLeaf(w, ptAlong(w, s1), {x:-u.x, y:-u.y}, d.side, half, col);
  } else {
    const hingeS = d.hinge > 0 ? s0 : s1;
    const closedDir = d.hinge > 0 ? u : {x:-u.x, y:-u.y};
    drawDoorLeaf(w, ptAlong(w, hingeS), closedDir, d.side, dw, col);
  }
  if (isGhost && !valid){
    ctx.strokeStyle = C.invalid; ctx.lineWidth = 2;
    const m = S(ptAlong(w, d.s));
    line({x:m.x-6, y:m.y-6}, {x:m.x+6, y:m.y+6});
    line({x:m.x+6, y:m.y-6}, {x:m.x-6, y:m.y+6});
  }
  ctx.globalAlpha = 1;
}

function dimLabel(aW, bW, text, bad){
  const a = S(aW), b = S(bW);
  const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
  ctx.font = `500 11px "IBM Plex Mono", monospace`;
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = bad ? C.handle : C.ink;
  ctx.fillRect(mx - w/2, my - 19, w, 16);
  ctx.fillStyle = C.paper;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, mx, my - 11);
}

function draw(){
  const wpx = wrap.clientWidth, hpx = wrap.clientHeight;
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, wpx, hpx);
  drawGrid();
  drawFloorBelowGhost();

  for (const r of flRooms()) drawRoom(r);
  for (const co of flCutouts()) drawCutout(co, false);
  for (const p of flPillars()) drawPillar(p, false);

  // extrude preview
  if (drag && drag.mode === 'extrude'){
    const pts = extrudePts(drag.wall, drag.d);
    const ok = extrudeValid(drag.wall, drag.d);
    ctx.beginPath();
    pts.forEach((p,i)=>{ const s=S(p); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); });
    ctx.closePath();
    ctx.fillStyle = ok ? 'rgba(217,48,37,.06)' : 'rgba(154,160,166,.15)';
    ctx.fill();
    ctx.strokeStyle = ok ? C.handle : C.invalid;
    ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
    ctx.stroke(); ctx.setLineDash([]);
    dimLabel(pts[1], pts[2], fmt(Math.abs(drag.d)) + ' m', !ok);
  }

  for (const w of flWalls()) drawWall(w);
  for (const st of flStairs()) drawStair(st, false);

  // cutout drag preview
  if (drag && drag.mode === 'cutout'){
    const co = {x: Math.min(drag.a.x, drag.b.x), y: Math.min(drag.a.y, drag.b.y),
                w: Math.abs(drag.b.x - drag.a.x), h: Math.abs(drag.b.y - drag.a.y)};
    if (co.w > 0.05 && co.h > 0.05) drawCutout(co, true);
  }

  // wall-draw preview
  if (drag && drag.mode === 'wall'){
    const a = S(drag.a), b = S(drag.b);
    const bad = false;
    ctx.strokeStyle = drag.kind === 'interior' ? C.interior : C.accent;
    ctx.lineWidth = drag.kind === 'interior' ? intPx() : wallPx();
    ctx.setLineDash([8,5]); ctx.lineCap = 'butt';
    line(a, b); ctx.setLineDash([]);
    const L = Math.hypot(drag.b.x - drag.a.x, drag.b.y - drag.a.y);
    if (L > 0.05) dimLabel(drag.a, drag.b, fmt(L) + ' m', bad);
  }

  // red extrude handle
  const hw = flWalls().find(w => w.id === (hoverWall ?? sel));
  if (hw && !drag && (tool === 'wall' || tool === 'interior' || tool === 'select')){
    const side = cursorSide(Wd(mouse), hw);
    const hp = S(handlePos(hw, side));
    ctx.save();
    ctx.translate(hp.x, hp.y);
    ctx.rotate(Math.atan2(hw.y2 - hw.y1, hw.x2 - hw.x1));
    ctx.fillStyle = C.handle;
    ctx.strokeStyle = C.paper; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(-5, -5, 10, 10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.handle; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, -14); ctx.moveTo(-3, -12); ctx.lineTo(0, -15); ctx.lineTo(3, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(0, 14); ctx.moveTo(-3, 12); ctx.lineTo(0, 15); ctx.lineTo(3, 12); ctx.stroke();
    ctx.restore();
  }

  // door ghost
  if (ghost){
    const w = walls.find(x => x.id === ghost.wallId);
    if (w) drawDoor(w, ghost, true, doorValid(ghost));
  }
  // stair ghost
  if (stairGhost) drawStair({...stairGhost, ghost: true}, false);
  if (pillarGhost) drawPillar({...pillarGhost, ghost: true}, false);
}

/* ---------------- input ---------------- */
function localPos(e){
  const r = cv.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}
function orthoB(a, p){ // force horizontal or vertical from a
  return Math.abs(p.x - a.x) >= Math.abs(p.y - a.y) ? {x: p.x, y: a.y} : {x: a.x, y: p.y};
}

cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('mousedown', e => {
  const p = localPos(e);
  mouse = {...p, in:true};
  const pW = Wd(p);

  if (e.button === 1 || (e.button === 0 && spaceHeld)){
    drag = {mode:'pan', start:p, view0:{...view}};
    cv.classList.add('panning');
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;

  // shift+click on red handle -> extrude
  if (e.shiftKey && (tool === 'wall' || tool === 'interior' || tool === 'select')){
    const w = flWalls().find(x => x.id === (hoverWall ?? sel));
    if (w){
      const side = cursorSide(pW, w);
      const hp = S(handlePos(w, side));
      if (Math.hypot(p.x - hp.x, p.y - hp.y) < 14){
        drag = {mode:'extrude', wall:w, d:0};
        return;
      }
    }
  }

  if (tool === 'wall' || tool === 'interior'){
    let a = pW;
    const es = snapToEndpoints(a); if (es) a = es;
    drag = {mode:'wall', kind: tool === 'interior' ? 'interior' : 'wall', a, b:{...a}};
  }
  else if (tool === 'select'){
    const hit = nearestWall(pW, 9);
    if (hit){
      sel = hit.wall.id;
      const w = hit.wall;
      const aS = S({x:w.x1, y:w.y1}), bS = S({x:w.x2, y:w.y2});
      const dA = Math.hypot(p.x - aS.x, p.y - aS.y);
      const dB = Math.hypot(p.x - bS.x, p.y - bS.y);
      if (dA < 11 || dB < 11){
        drag = {mode:'endpoint', wall:w, end: dA < dB ? 1 : 2, moved:false, started:false, start:p};
      } else {
        drag = {mode:'movewall', wall:w, start:p, startW:pW, acc:{x:0,y:0}, started:false};
      }
    } else sel = null;
    syncButtons();
  }
  else if (tool === 'door'){
    if (ghost) placeDoor(ghost);
  }
  else if (tool === 'stairs'){
    if (stairGhost){
      pushUndo();
      stairs.push({id: ids++, fl: curFl, cx: stairGhost.cx, cy: stairGhost.cy, type: stairGhost.type, rot: stairGhost.rot});
    }
  }
  else if (tool === 'pillar'){
    const c = snapOn ? snapPt(pW) : pW;
    placePillar({cx:c.x, cy:c.y, w:PILLAR_W, d:PILLAR_D});
  }
  else if (tool === 'cutout'){
    drag = {mode:'cutout', a: snapPt(pW), b: snapPt(pW), startPx: p};
  }
  else if (tool === 'erase'){
    let done = false;
    for (const d of doors.filter(d => d.fl === curFl)){
      const w = walls.find(x => x.id === d.wallId);
      if (!w) continue;
      const c = ptAlong(w, d.s);
      if (Math.hypot(pW.x - c.x, pW.y - c.y) < 0.45){
        pushUndo(); doors = doors.filter(x => x.id !== d.id); done = true; break;
      }
    }
    if (!done){
      const st = flStairs().find(s => { const r = stairRect(s); return pW.x > r.x0 && pW.x < r.x1 && pW.y > r.y0 && pW.y < r.y1; });
      if (st){ pushUndo(); stairs = stairs.filter(x => x.id !== st.id); done = true; }
    }
    if (!done){
      const pi = flPillars().find(p => { const r = pillarRect(p); return pW.x > r.x0 && pW.x < r.x1 && pW.y > r.y0 && pW.y < r.y1; });
      if (pi){ pushUndo(); pillars = pillars.filter(x => x.id !== pi.id); done = true; }
    }
    if (!done){
      const co = flCutouts().find(c => pW.x > c.x && pW.x < c.x + c.w && pW.y > c.y && pW.y < c.y + c.h);
      if (co){ pushUndo(); cutouts = cutouts.filter(x => x.id !== co.id); done = true; }
    }
    if (!done){
      const hit = nearestWall(pW, 9);
      if (hit){ tryEraseWall(hit.wall); done = true; }
    }
    if (!done){
      const r = flRooms().find(r => pointInPoly(pW, r.pts));
      if (r) eraseRoom(r); // wipes the room + its walls, doors, stairs & cutouts inside
    }
  }
  draw();
});

cv.addEventListener('mousemove', e => {
  const p = localPos(e);
  const prevW = Wd(mouse);
  mouse = {...p, in:true};
  const pW = Wd(p);
  coordsEl.textContent = `${pW.x.toFixed(1)}, ${pW.y.toFixed(1)} m`;

  if (drag){
    if (drag.mode === 'pan'){
      view.x = drag.view0.x - (p.x - drag.start.x) / view.s;
      view.y = drag.view0.y - (p.y - drag.start.y) / view.s;
    }
    else if (drag.mode === 'wall'){
      let b = orthoB(drag.a, pW);          // walls are always orthogonal now
      const es = snapToEndpoints(b); if (es && (es.x === drag.a.x || es.y === drag.a.y)) b = es;
      drag.b = b;
    }
    else if (drag.mode === 'extrude'){
      const w = drag.wall, n = nrm(w), m = mid(w);
      drag.d = (pW.x - m.x) * n.x + (pW.y - m.y) * n.y;
    }
    else if (drag.mode === 'movewall'){
      if (!drag.started && Math.hypot(p.x - drag.start.x, p.y - drag.start.y) > 4){
        drag.started = true;
        pushUndo();
      }
      if (drag.started){
        const w = drag.wall, n = nrm(w);
        const dW = {x: pW.x - prevW.x, y: pW.y - prevW.y};
        const dPerp = dW.x * n.x + dW.y * n.y;     // constrain to perpendicular
        const delta = {x: n.x * dPerp, y: n.y * dPerp};
        moveWallBody(w, delta);
        drag.acc.x += delta.x; drag.acc.y += delta.y;
      }
    }
    else if (drag.mode === 'endpoint'){
      if (!drag.started && Math.hypot(p.x - drag.start.x, p.y - drag.start.y) > 4){
        drag.started = true;
        pushUndo();
      }
      if (drag.started){
        const w = drag.wall, u = dir(w);
        // slide the endpoint along the wall's own axis only
        if (drag.end === 1){
          const t = (pW.x - w.x2) * u.x + (pW.y - w.y2) * u.y;
          w.x1 = w.x2 + u.x * Math.min(t, -MIN_WALL);
          w.y1 = w.y2 + u.y * Math.min(t, -MIN_WALL);
        } else {
          const t = (pW.x - w.x1) * u.x + (pW.y - w.y1) * u.y;
          w.x2 = w.x1 + u.x * Math.max(t, MIN_WALL);
          w.y2 = w.y1 + u.y * Math.max(t, MIN_WALL);
        }
        // keep doors inside
        const L = len(w);
        for (const d of doors.filter(d => d.wallId === w.id))
          d.s = Math.max(doorWidth(d)/2 + 0.05, Math.min(L - doorWidth(d)/2 - 0.05, d.s));
      }
    }
    else if (drag.mode === 'cutout'){
      drag.b = snapOn ? snapPt(pW) : pW;
    }
    draw();
    return;
  }

  // hover: nearest wall for the red handle
  if (tool === 'wall' || tool === 'interior' || tool === 'select'){
    const hit = nearestWall(pW, 48);
    hoverWall = hit ? hit.wall.id : null;
  } else hoverWall = null;

  // door ghost
  if (tool === 'door'){
    const hit = nearestWall(pW, 14);
    if (hit){
      const w = hit.wall, L = len(w), dw = DOOR_TYPES[doorType].w;
      if (L >= dw + 0.3){
        let ds = hit.t * L;
        ds = Math.max(dw/2 + 0.1, Math.min(L - dw/2 - 0.1, ds));
        if (snapOn) ds = Math.round(ds / (GRID/2)) * (GRID/2);
        ds = Math.max(dw/2 + 0.1, Math.min(L - dw/2 - 0.1, ds));
        ghost = {wallId: w.id, s: ds, side: ghostSide, hinge: ghostHinge, type: doorType, width: dw};
      } else ghost = null;
    } else ghost = null;
  } else ghost = null;

  // stair ghost
  if (tool === 'stairs'){
    const c = snapOn ? snapPt(pW) : pW;
    stairGhost = {cx: c.x, cy: c.y, type: stairType, rot: stairRot};
  } else stairGhost = null;

  if (tool === 'pillar'){
    const c = snapOn ? snapPt(pW) : pW;
    pillarGhost = {cx: c.x, cy: c.y, w: PILLAR_W, d: PILLAR_D};
  } else pillarGhost = null;

  draw();
});

window.addEventListener('mouseup', e => {
  if (!drag) return;
  if (drag.mode === 'wall'){
    let a = drag.a, b = drag.b;
    const ea = snapToEndpoints(a), eb = snapToEndpoints(b);
    a = ea || snapPt(a); b = eb || snapPt(b);
    b = orthoB(a, b); // re-assert ortho after snapping
    if (Math.hypot(b.x - a.x, b.y - a.y) >= MIN_WALL) addWall(a, b, drag.kind);
  }
  else if (drag.mode === 'extrude'){
    let d = drag.d;
    if (snapOn) d = snap(d);
    if (Math.abs(d) >= MIN_WALL) extrudeRoom(drag.wall, d);
  }
  else if (drag.mode === 'movewall' && drag.started){
    // settle onto the grid: snap the accumulated offset
    if (snapOn){
      const w = drag.wall, n = nrm(w);
      const accPerp = drag.acc.x * n.x + drag.acc.y * n.y;
      const corr = snap(accPerp) - accPerp;
      if (Math.abs(corr) > EPS) moveWallBody(w, {x: n.x * corr, y: n.y * corr});
    }
  }
  else if (drag.mode === 'endpoint' && drag.started){
    const w = drag.wall;
    if (snapOn){
      if (drag.end === 1){ const s = snapPt({x:w.x1, y:w.y1}); w.x1 = s.x; w.y1 = s.y; }
      else { const s = snapPt({x:w.x2, y:w.y2}); w.x2 = s.x; w.y2 = s.y; }
      if (len(w) < MIN_WALL){ /* undo the over-shrink */ undo(); redoStack.pop(); }
    }
  }
  else if (drag.mode === 'cutout'){
    const p = localPos(e);
    const moved = Math.hypot(p.x - drag.startPx.x, p.y - drag.startPx.y) > 5;
    if (!moved && curFl > 1){
      // click inside a below-floor staircase -> auto-cut its exact footprint
      const pW = Wd(p);
      const st = stairs.filter(s => s.fl === curFl - 1)
        .find(s => { const r = stairRect(s); return pW.x > r.x0 && pW.x < r.x1 && pW.y > r.y0 && pW.y < r.y1; });
      if (st){
        const r = stairRect(st);
        pushUndo();
        cutouts.push({id: ids++, fl: curFl, x: r.x0, y: r.y0, w: r.x1 - r.x0, h: r.y1 - r.y0});
      }
    } else if (moved){
      const x = Math.min(drag.a.x, drag.b.x), y = Math.min(drag.a.y, drag.b.y);
      const w = Math.abs(drag.b.x - drag.a.x), h = Math.abs(drag.b.y - drag.a.y);
      if (w >= GRID && h >= GRID){
        pushUndo();
        cutouts.push({id: ids++, fl: curFl, x, y, w, h});
      }
    }
  }
  drag = null;
  cv.classList.remove('panning');
  draw();
});

cv.addEventListener('mouseleave', () => { mouse.in = false; ghost = null; stairGhost = null; pillarGhost = null; hoverWall = null; draw(); });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const p = localPos(e);
  const before = Wd(p);
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  view.s = Math.max(8, Math.min(260, view.s * f));
  const after = Wd(p);
  view.x += before.x - after.x;
  view.y += before.y - after.y;
  zoomEl.textContent = Math.round(view.s / 46 * 100) + '%';
  draw();
}, {passive:false});

/* ---------------- keyboard ---------------- */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  if (k === ' '){ spaceHeld = true; e.preventDefault(); }
  else if (!mod && k === 'v') setTool('select');
  else if (!mod && k === 'w') setTool('wall');
  else if (!mod && k === 'i') setTool('interior');
  else if (!mod && k === 'd') setTool('door');
  else if (!mod && k === 's') setTool('stairs');
  else if (!mod && k === 'c') setTool('cutout');
  else if (!mod && k === 'p') setTool('pillar');
  else if (!mod && k === 'e') setTool('erase');
  else if (!mod && k === 'g') toggleSnap();
  else if (!mod && k === 'n') toggleWindows();
  else if (k === 'r'){
    if (tool === 'stairs'){ stairRot = (stairRot + 90) % 360; if (stairGhost) stairGhost.rot = stairRot; }
    else { ghostSide *= -1; if (ghost) ghost.side = ghostSide; }
    draw();
  }
  else if (k === 'f'){ ghostHinge *= -1; if (ghost) ghost.hinge = ghostHinge; draw(); }
  else if (k === 'escape'){ drag = null; sel = null; syncButtons(); draw(); }
  else if (k === 'delete' || k === 'backspace'){
    const w = walls.find(x => x.id === sel);
    if (w){ tryEraseWall(w); syncButtons(); draw(); }
  }
  else if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); }
});
window.addEventListener('keyup', e => { if (e.key === ' ') spaceHeld = false; });

/* =========================================================
   Wavefront .obj export (v0.3.10)
   World plan (x, y) + height z  ->  OBJ (X, Y=up, Z=-y),
   which Blender's importer (Y up, -Z forward) reads with the
   plan matching the blueprint when viewed from the top.
   Everything is emitted as axis-aligned boxes:
   - floor slabs (FLOOR_T thick) per room footprint, cutouts subtracted
   - room wall corners are capped/mitered without overlapping boxes
   - shared room-to-room wall spans emitted once
     (no overlapping geometry), with door + window
     openings cut out and lintels/sills kept
   - a thin mock door panel in every doorway
   - all three staircase types as real steps (u-turn gets two
     flights + a landing), rotated with their placement
   - repeated per floor with the correct z offset
========================================================= */
const rnd4 = v => String(Math.round(v * 10000) / 10000 + 0); // + 0 normalizes -0

// r minus c, both {x0,y0,x1,y1} -> up to 4 rects
function subtractRect(r, c){
  const ix0 = Math.max(r.x0, c.x0), ix1 = Math.min(r.x1, c.x1);
  const iy0 = Math.max(r.y0, c.y0), iy1 = Math.min(r.y1, c.y1);
  if (ix1 - ix0 <= EPS || iy1 - iy0 <= EPS) return [r]; // no intersection
  const out = [];
  if (iy0 - r.y0 > EPS) out.push({x0:r.x0, y0:r.y0, x1:r.x1, y1:iy0});
  if (r.y1 - iy1 > EPS) out.push({x0:r.x0, y0:iy1, x1:r.x1, y1:r.y1});
  if (ix0 - r.x0 > EPS) out.push({x0:r.x0, y0:iy0, x1:ix0, y1:iy1});
  if (r.x1 - ix1 > EPS) out.push({x0:ix1, y0:iy0, x1:r.x1, y1:iy1});
  return out;
}

// local (pre-rotation) step boxes for a staircase; z relative to slab top, rise = FLOOR_H
function stairLocalBoxes(st){
  const t = STAIR_TYPES[st.type];
  const out = []; // {lx0,ly0,lx1,ly1, dz0, dz1}  dz measured from slab top; dz0 = -FLOOR_T sinks to level base
  if (st.type === 'uturn'){
    const run = t.h - t.landing, N = 6;
    const riser = (FLOOR_H / 2) / N, tread = run / N;
    for (let i = 0; i < N; i++){ // up flight: right half, +y (bottom) toward the landing
      out.push({lx0: 0, lx1: t.w/2, ly0: t.h/2 - (i+1)*tread, ly1: t.h/2 - i*tread,
                dz0: -FLOOR_T, dz1: (i+1)*riser});
    }
    out.push({lx0: -t.w/2, lx1: t.w/2, ly0: -t.h/2, ly1: -t.h/2 + t.landing,
              dz0: -FLOOR_T, dz1: FLOOR_H/2}); // landing
    for (let i = 0; i < N; i++){ // return flight: left half, landing back toward +y
      out.push({lx0: -t.w/2, lx1: 0, ly0: -t.h/2 + t.landing + i*tread, ly1: -t.h/2 + t.landing + (i+1)*tread,
                dz0: -FLOOR_T, dz1: FLOOR_H/2 + (i+1)*riser});
    }
  } else { // straight & wide: one flight along the full length
    const N = 12, riser = FLOOR_H / N, tread = t.h / N;
    for (let i = 0; i < N; i++){
      out.push({lx0: -t.w/2, lx1: t.w/2, ly0: t.h/2 - (i+1)*tread, ly1: t.h/2 - i*tread,
                dz0: -FLOOR_T, dz1: (i+1)*riser});
    }
  }
  return out;
}
function rotBox(b, st){ // rotate a local box by st.rot around the stair centre (90° multiples stay axis-aligned)

function buildObjModel(){

  const objName = name => String(name || 'Room')
    .replace(/[^A-Za-z0-9_\-]+/g, '_')
    .replace(/^_+|_+$/g, '') || 'Room';

  const roomHalfT = r => {
    const own = walls.filter(w => w.roomId === r.id);
    return (own.length && own.every(w => w.kind === 'interior') ? INT_T : WALL_T) / 2;
  };
  const roomSlabRect = r => {
    // Floors/ceilings expand to the wall outside faces so they are flush with
    // exported wall thickness again. Same-floor overlaps are subtracted below,
    // so connected rooms do not keep duplicate slab strips on shared boundaries.
    const bb = bbox(r.pts), ht = roomHalfT(r);

  };
  const cutoutRectForRoom = (r, c) => {
    // If a cutout is dragged all the way to a room wall, preserve a wall-thickness
    // rim under that wall. This keeps upper and lower wall faces connected through
    // the slab thickness instead of exposing a thin gap between floors.
    const bb = bbox(r.pts), ht = roomHalfT(r), tol = 0.035;

        const r = rotBox(lb, st);
        g.boxes.push({...r, z0: zTop + lb.dz0, z1: zTop + lb.dz1, kind:'stair', mats: faceMats(defaultMats.stair)});
      }
    }

    for (const p of pillars.filter(p => p.fl === fl)){
      const owner = roomList.find(r => roomContainsOrTouchesPoint(r, {x:p.cx, y:p.cy}));
