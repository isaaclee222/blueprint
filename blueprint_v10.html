      const r = pillarRect(p);
      g.boxes.push({...r, z0: zTop, z1: zCeil + FLOOR_T, kind:'pillar', mats: faceMats(defaultMats.pillar)});
    }

    // Keep any hand-drawn freestanding walls exportable too, without folding them into room objects.
    const looseWalls = walls.filter(w => w.fl === fl && roomOf(w) === null);
    if (looseWalls.length){
      const g = addGroup('F' + fl + '_Loose_Walls');
      for (const w of looseWalls) addWallToGroup(g, w, zTop, zCeil);
    }
  }
  return groups.filter(g => g.boxes.length || g.prisms.length);
}


function downloadTextFile(filename, text, type = 'text/plain'){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function buildBlenderPBRScript(){
  return "# Blueprint PBR ZIP helper for Blender\n# Version 0.3.10\n#\n# Workflow:\n# 1) Import blueprint.obj into Blender.\n# 2) Save the .blend file in your project folder.\n# 3) Put full PBR ZIP files from ambientCG/etc. into a folder named pbr_zips next to the .blend.\n# 4) In Blender: Scripting > Open this file > Run Script.\n#\n# The script extracts the needed maps into textures_pbr_extracted/ and wires\n# BaseColor, Roughness, Metallic, Normal, Height/Bump, and optional AO.\n\nimport os\nimport re\nimport zipfile\nfrom pathlib import Path\n\nimport bpy\n\nPBR_ZIP_FOLDER_NAME = \"pbr_zips\"\nEXTRACT_FOLDER_NAME = \"textures_pbr_extracted\"\nTILE_SCALE_METERS = 1.0\n\n# Blueprint material slot -> expected asset id in the downloaded PBR zip filename/path.\n# Reused assets are intentional: the same Concrete023 zip can drive several materials.\nMATERIAL_ASSETS = {\n    \"Exterior_Brick\": \"Bricks038\",\n    \"Exterior_Stylized_Concrete\": \"Concrete023\",\n    \"Interior_Drywall_Warm\": \"PaintedPlaster003\",\n    \"Interior_Drywall_White\": \"PaintedPlaster003\",\n    \"Interior_Drywall_BlueGray\": \"PaintedPlaster003\",\n    \"Interior_Brick\": \"Bricks023\",\n    \"Interior_Plain_Concrete\": \"Concrete023\",\n    \"Interior_Wallpaper_Muted\": \"Fabric022\",\n    \"Interior_Marble\": \"Marble012\",\n    \"Ceiling_Tiles\": \"OfficeCeiling001\",\n    \"Floor_Wood_Dark\": \"WoodFloor040\",\n    \"Floor_Carpet_Charcoal\": \"Carpet012\",\n    \"Floor_Carpet_Brown\": \"Carpet012\",\n    \"Floor_Carpet_BlueGray\": \"Carpet012\",\n    \"Floor_Tile_Slate\": \"Tiles027\",\n    \"Floor_Marble_Gray\": \"Marble001\",\n    \"Floor_Concrete\": \"Concrete040\",\n    \"Roof_Concrete\": \"Concrete023\",\n    \"Pillar_Concrete\": \"Concrete023\",\n    \"Stair_Concrete\": \"Concrete023\",\n    \"Cut_Edge_Concrete\": \"Concrete023\",\n}\n\n# Some simple color tints keep the reused drywall/carpet maps visually distinct.\nMATERIAL_TINTS = {\n    \"Interior_Drywall_Warm\": (1.00, 0.96, 0.86, 1.0),\n    \"Interior_Drywall_White\": (1.00, 1.00, 0.96, 1.0),\n    \"Interior_Drywall_BlueGray\": (0.68, 0.76, 0.82, 1.0),\n    \"Floor_Carpet_Charcoal\": (0.45, 0.45, 0.45, 1.0),\n    \"Floor_Carpet_Brown\": (0.55, 0.42, 0.32, 1.0),\n    \"Floor_Carpet_BlueGray\": (0.45, 0.55, 0.62, 1.0),\n}\n\nIMAGE_EXTS = {\".jpg\", \".jpeg\", \".png\", \".tif\", \".tiff\", \".exr\"}\n\n\ndef project_dir() -> Path:\n    if bpy.data.filepath:\n        return Path(bpy.data.filepath).resolve().parent\n    return Path.cwd()\n\n\ndef clean_name(name: str) -> str:\n    return re.sub(r\"[^a-z0-9]+\", \"\", name.lower())\n\n\ndef find_zip_files(root: Path):\n    folders = []\n    preferred = root / PBR_ZIP_FOLDER_NAME\n    if preferred.exists():\n        folders.append(preferred)\n    folders.append(root)\n    found = []\n    seen = set()\n    for folder in folders:\n        for path in folder.glob(\"*.zip\"):\n            if path.resolve() not in seen:\n                found.append(path)\n                seen.add(path.resolve())\n    return found\n\n\ndef classify_map(filename: str):\n    lower = filename.lower()\n    stem = Path(lower).stem\n    if Path(lower).suffix not in IMAGE_EXTS:\n        return None\n    # Prefer OpenGL normal maps for Blender. DX normal maps need a green-channel flip.\n    if \"normalgl\" in lower or \"normal_gl\" in lower or \"opengl\" in lower:\n        return \"normal_gl\"\n    if \"normaldx\" in lower or \"normal_dx\" in lower or \"directx\" in lower:\n        return \"normal_dx\"\n    if \"normal\" in lower or stem.endswith(\"_nor\") or stem.endswith(\"-nor\"):\n        return \"normal\"\n    if \"roughness\" in lower or stem.endswith(\"_rough\") or stem.endswith(\"-rough\"):\n        return \"roughness\"\n    if \"metallic\" in lower or \"metalness\" in lower:\n        return \"metallic\"\n    if \"ambientocclusion\" in lower or \"ambient_occlusion\" in lower or re.search(r\"(^|[_\\-])ao($|[_\\-])\", stem):\n        return \"ao\"\n    if \"displacement\" in lower or \"height\" in lower or stem.endswith(\"_disp\") or stem.endswith(\"-disp\"):\n        return \"height\"\n    if (\n        \"basecolor\" in lower or \"base_color\" in lower or \"albedo\" in lower or\n        \"diffuse\" in lower or re.search(r\"(^|[_\\-])color($|[_\\-])\", stem) or stem.endswith(\"_col\") or stem.endswith(\"-col\")\n    ):\n        return \"basecolor\"\n    return None\n\n\ndef choose_asset_zip(asset_id: str, zips):\n    target = clean_name(asset_id)\n    best = None\n    best_score = -1\n    for z in zips:\n        name_score = 10 if target in clean_name(z.name) else 0\n        path_score = 0\n        try:\n            with zipfile.ZipFile(z) as zf:\n                sample = \" \".join(zf.namelist()[:80])\n                if target in clean_name(sample):\n                    path_score = 8\n        except Exception:\n            continue\n        score = name_score + path_score\n        if score > best_score:\n            best = z\n            best_score = score\n    return best if best_score > 0 else None\n\n\ndef extract_maps(zip_path: Path, asset_id: str, dest_root: Path, material_name: str):\n    dest = dest_root / material_name\n    dest.mkdir(parents=True, exist_ok=True)\n    maps = {}\n    target = clean_name(asset_id)\n    with zipfile.ZipFile(zip_path) as zf:\n        for info in zf.infolist():\n            if info.is_dir():\n                continue\n            name = info.filename\n            if Path(name).suffix.lower() not in IMAGE_EXTS:\n                continue\n            # Prefer files that include the intended asset id, but allow zips with a single asset folder.\n            if target not in clean_name(name) and target not in clean_name(zip_path.name):\n                continue\n            map_type = classify_map(name)\n            if not map_type:\n                continue\n            # For normal maps, prefer NormalGL over generic over NormalDX.\n            if map_type in {\"normal_gl\", \"normal\", \"normal_dx\"}:\n                existing = maps.get(\"normal\")\n                priority = {\"normal_gl\": 3, \"normal\": 2, \"normal_dx\": 1}[map_type]\n                if existing and existing[1] >= priority:\n                    continue\n                out_path = dest / Path(name).name\n                with zf.open(info) as src, open(out_path, \"wb\") as out:\n                    out.write(src.read())\n                maps[\"normal\"] = (out_path, priority)\n                continue\n            if map_type in maps:\n                # Keep first useful map of each type.\n                continue\n            out_path = dest / Path(name).name\n            with zf.open(info) as src, open(out_path, \"wb\") as out:\n                out.write(src.read())\n            maps[map_type] = out_path\n    if isinstance(maps.get(\"normal\"), tuple):\n        maps[\"normal\"] = maps[\"normal\"][0]\n    return maps\n\n\ndef load_image(path: Path, color_space=\"sRGB\"):\n    img = bpy.data.images.load(str(path), check_existing=True)\n    # Blender color management values differ by version. Try common ones.\n    try:\n        img.colorspace_settings.name = color_space\n    except Exception:\n        if color_space == \"Non-Color\":\n            try:\n                img.colorspace_settings.name = \"Non-Color Data\"\n            except Exception:\n                pass\n    return img\n\n\ndef input_socket(node, *names):\n    for name in names:\n        sock = node.inputs.get(name)\n        if sock:\n            return sock\n    return None\n\n\ndef output_socket(node, *names):\n    for name in names:\n        sock = node.outputs.get(name)\n        if sock:\n            return sock\n    return None\n\n\ndef make_tex_node(nodes, path: Path, label: str, color_space=\"sRGB\", x=-700, y=0):\n    node = nodes.new(type=\"ShaderNodeTexImage\")\n    node.label = label\n    node.location = (x, y)\n    node.image = load_image(path, color_space)\n    return node\n\n\ndef rebuild_material(mat, maps, tint=None):\n    mat.use_nodes = True\n    nodes = mat.node_tree.nodes\n    links = mat.node_tree.links\n    nodes.clear()\n\n    out = nodes.new(type=\"ShaderNodeOutputMaterial\")\n    out.location = (350, 0)\n    bsdf = nodes.new(type=\"ShaderNodeBsdfPrincipled\")\n    bsdf.location = (80, 0)\n    links.new(output_socket(bsdf, \"BSDF\"), input_socket(out, \"Surface\"))\n\n    base_socket = input_socket(bsdf, \"Base Color\")\n    rough_socket = input_socket(bsdf, \"Roughness\")\n    metal_socket = input_socket(bsdf, \"Metallic\")\n    normal_socket = input_socket(bsdf, \"Normal\")\n\n    if rough_socket:\n        rough_socket.default_value = 0.85\n    if metal_socket:\n        metal_socket.default_value = 0.0\n\n    base_node = None\n    if maps.get(\"basecolor\") and base_socket:\n        base_node = make_tex_node(nodes, maps[\"basecolor\"], \"BaseColor / Albedo\", \"sRGB\", -760, 180)\n        source_color = output_socket(base_node, \"Color\")\n        if tint:\n            try:\n                tint_node = nodes.new(type=\"ShaderNodeMixRGB\")\n                tint_node.location = (-420, 160)\n                tint_node.blend_type = \"MULTIPLY\"\n                tint_node.inputs[0].default_value = 0.45\n                tint_node.inputs[2].default_value = tint\n                links.new(source_color, tint_node.inputs[1])\n                links.new(tint_node.outputs[0], base_socket)\n            except Exception:\n                links.new(source_color, base_socket)\n        else:\n            links.new(source_color, base_socket)\n\n    if maps.get(\"ao\") and base_node and base_socket:\n        try:\n            ao_node = make_tex_node(nodes, maps[\"ao\"], \"Ambient Occlusion\", \"Non-Color\", -760, 0)\n            mix = nodes.new(type=\"ShaderNodeMixRGB\")\n            mix.location = (-190, 120)\n            mix.blend_type = \"MULTIPLY\"\n            mix.inputs[0].default_value = 0.35\n            # Rewire whatever is currently feeding Base Color into the multiply node.\n            existing = None\n            for link in list(links):\n                if link.to_socket == base_socket:\n                    existing = link.from_socket\n                    links.remove(link)\n                    break\n            if existing:\n                links.new(existing, mix.inputs[1])\n            else:\n                mix.inputs[1].default_value = (1, 1, 1, 1)\n            links.new(output_socket(ao_node, \"Color\"), mix.inputs[2])\n            links.new(mix.outputs[0], base_socket)\n        except Exception:\n            pass\n\n    if maps.get(\"roughness\") and rough_socket:\n        rough_node = make_tex_node(nodes, maps[\"roughness\"], \"Roughness\", \"Non-Color\", -760, -160)\n        links.new(output_socket(rough_node, \"Color\"), rough_socket)\n\n    if maps.get(\"metallic\") and metal_socket:\n        metal_node = make_tex_node(nodes, maps[\"metallic\"], \"Metallic\", \"Non-Color\", -760, -320)\n        links.new(output_socket(metal_node, \"Color\"), metal_socket)\n\n    normal_output = None\n    if maps.get(\"normal\"):\n        normal_tex = make_tex_node(nodes, maps[\"normal\"], \"Normal\", \"Non-Color\", -760, -500)\n        normal_map = nodes.new(type=\"ShaderNodeNormalMap\")\n        normal_map.location = (-420, -500)\n        try:\n            normal_map.inputs[\"Strength\"].default_value = 0.85\n        except Exception:\n            pass\n        links.new(output_socket(normal_tex, \"Color\"), input_socket(normal_map, \"Color\"))\n        normal_output = output_socket(normal_map, \"Normal\")\n\n    if maps.get(\"height\"):\n        try:\n            height_tex = make_tex_node(nodes, maps[\"height\"], \"Height / Displacement as Bump\", \"Non-Color\", -760, -680)\n            bump = nodes.new(type=\"ShaderNodeBump\")\n            bump.location = (-180, -560)\n            if input_socket(bump, \"Strength\"):\n                input_socket(bump, \"Strength\").default_value = 0.05\n            if input_socket(bump, \"Distance\"):\n                input_socket(bump, \"Distance\").default_value = 0.06\n            links.new(output_socket(height_tex, \"Color\"), input_socket(bump, \"Height\"))\n            if normal_output and input_socket(bump, \"Normal\"):\n                links.new(normal_output, input_socket(bump, \"Normal\"))\n            normal_output = output_socket(bump, \"Normal\")\n        except Exception:\n            pass\n\n    if normal_output and normal_socket:\n        links.new(normal_output, normal_socket)\n\n\ndef main():\n    root = project_dir()\n    zips = find_zip_files(root)\n    if not zips:\n        raise RuntimeError(f\"No ZIP files found. Put full PBR texture ZIPs in {root / PBR_ZIP_FOLDER_NAME} or next to the .blend file.\")\n\n    extract_root = root / EXTRACT_FOLDER_NAME\n    extract_root.mkdir(parents=True, exist_ok=True)\n    applied = []\n    missing_materials = []\n    missing_zips = []\n    missing_maps = []\n\n    for mat_name, asset_id in MATERIAL_ASSETS.items():\n        mat = bpy.data.materials.get(mat_name)\n        if mat is None:\n            missing_materials.append(mat_name)\n            continue\n        zip_path = choose_asset_zip(asset_id, zips)\n        if not zip_path:\n            missing_zips.append(f\"{mat_name} -> {asset_id}\")\n            continue\n        maps = extract_maps(zip_path, asset_id, extract_root, mat_name)\n        if not maps.get(\"basecolor\"):\n            missing_maps.append(f\"{mat_name}: no base color found in {zip_path.name}\")\n            continue\n        rebuild_material(mat, maps, MATERIAL_TINTS.get(mat_name))\n        applied.append(f\"{mat_name} <- {zip_path.name} ({', '.join(sorted(maps.keys()))})\")\n\n    print(\"\\n=== Blueprint PBR ZIP Helper ===\")\n    print(f\"Project folder: {root}\")\n    print(f\"ZIP files scanned: {len(zips)}\")\n    print(f\"Materials updated: {len(applied)}\")\n    for item in applied:\n        print(\"  OK\", item)\n    if missing_zips:\n        print(\"\\nMissing ZIPs:\")\n        for item in missing_zips:\n            print(\"  \", item)\n    if missing_maps:\n        print(\"\\nMissing maps:\")\n        for item in missing_maps:\n            print(\"  \", item)\n    if missing_materials:\n        print(\"\\nBlueprint materials not present in this Blender file:\")\n        for item in missing_materials:\n            print(\"  \", item)\n    print(\"\\nDone. Switch to Material Preview or Rendered view to inspect the PBR materials.\")\n\n\nif __name__ == \"__main__\":\n    main()\n";
}
function buildPBRZipReadme(){
  return "Blueprint full-PBR ZIP workflow\nVersion 0.3.10\n\nThis is for the full ambientCG-style texture ZIPs that contain BaseColor/Color, Roughness, NormalGL/NormalDX, Displacement/Height, AO, etc.\n\nFolder layout:\n\nproject-folder/\n  your_building.blend\n  blueprint.obj\n  blueprint.mtl\n  pbr_zips/\n    Bricks038_1K-JPG.zip\n    Concrete023_1K-JPG.zip\n    PaintedPlaster003_1K-JPG.zip\n    Carpet012_1K-JPG.zip\n    ...\n  blueprint_apply_pbr_from_zips.py\n\nSteps:\n1. Export OBJ from the blueprint tool.\n2. Import blueprint.obj into Blender.\n3. Save the Blender file in your project folder.\n4. Put the full downloaded PBR ZIPs in a folder named pbr_zips next to the .blend file.\n5. In Blender, open the Scripting tab.\n6. Open blueprint_apply_pbr_from_zips.py and Run Script.\n7. Switch to Material Preview or Rendered view.\n\nThe script extracts the image maps into textures_pbr_extracted/ and wires Blender materials automatically.\nIt uses BaseColor, Roughness, Metallic when present, NormalGL/Normal, Height as Bump, and optional Ambient Occlusion.\nNormalGL/OpenGL normal maps are preferred for Blender. If only NormalDX is present, the script can still use it, but lighting may look slightly inverted.\n\nDo not drag the ZIPs or JPGs into the Blender collection. The script connects the images to material nodes.\n";
}
function exportPBRHelper(){
  downloadTextFile('blueprint_apply_pbr_from_zips.py', buildBlenderPBRScript(), 'text/x-python');
  downloadTextFile('blueprint_pbr_zip_readme.txt', buildPBRZipReadme(), 'text/plain');
  warn('Downloaded Blender PBR ZIP helper. Put full texture zips in a pbr_zips folder next to your saved .blend, then run the script in Blender.');
}

function buildMTL(){
  const lines = ['# Blueprint material library — ready for local texture testing.'];
  lines.push('# Keep blueprint.obj, blueprint.mtl, and the textures/ folder in the SAME folder.');
  lines.push('# The map_Kd lines below are already active; no manual uncommenting is needed.');
  for (const [name, m] of Object.entries(MATERIALS)){
    const kd = m.kd || [0.5,0.5,0.5];
    const alpha = m.alpha == null ? 1 : m.alpha;
    const tex = TEXTURE_SOURCES[name];
    lines.push('');
    if (tex) lines.push('# ' + tex.source + ' asset: ' + tex.asset + ' — ' + tex.url);
    lines.push('newmtl ' + name,
      'Ka ' + kd.map(rnd4).join(' '),
      'Kd ' + kd.map(rnd4).join(' '),
      'Ks ' + (m.rough && m.rough > 0.8 ? '0.02 0.02 0.02' : '0.12 0.12 0.12'),
      'Ns ' + rnd4(20 + (1 - (m.rough || 0.7)) * 120),
      'd ' + rnd4(alpha),
      'illum ' + (alpha < 1 ? 4 : 2));
    if (tex && alpha >= 1) lines.push('map_Kd textures/' + tex.file);
  }
  return lines.join('\n');
}
function buildTextureManifest(){
  const lines = [
    'Blueprint texture manifest (prototype)',
    'The exported blueprint.mtl already contains active map_Kd texture links. No uncommenting is needed.',
    'Put the textures folder next to blueprint.obj and blueprint.mtl before importing blueprint.obj into Blender.',
    'UV mapping: 1 texture tile per meter. Vertical walls use horizontal meters × height; floors/ceilings use plan X/Y meters.',
    'For full PBR maps, use the PBR ZIPs button to download the Blender helper script.',
    ''
  ];
  const seen = new Set();
  for (const [mat, tex] of Object.entries(TEXTURE_SOURCES)){
    const key = tex.asset + '|' + tex.file;
    if (seen.has(key)) continue;
    seen.add(key);
    lines.push(mat + ' -> ' + tex.source + ' ' + tex.asset,
      '  URL: ' + tex.url,
      '  Save base color/diffuse/albedo as: textures/' + tex.file,
      '');
  }
  return lines.join('\n');
}

function exportOBJ(){
  const groups = buildObjModel();
  if (!groups.length){ warn('Nothing to export yet — draw some rooms first.'); return; }
  const out = [
    '# Blueprint — Smart Building Sketch, prototype 0.3.10',
    '# Wavefront OBJ export · units: meters · Y is up (plan x -> -X, plan y -> -Z)',
    '# floors: ' + nFloors + ' · floor height ' + FLOOR_H + ' m · slab ' + FLOOR_T + ' m · half walls ' + HALF_H + ' m',
    '# Each room is emitted as its own OBJ object: F1_Room_1, F1_Room_2, etc.',
    '# Shared room-to-room walls are emitted once; wall editing is permissive for tracing real plans.',
    '# Wall ends/junctions are capped/trimmed for flush interior and exterior corners.',
    '# Doors are exported as 45-degree open panels; pillars export as full-height supports.',
    '# Materials are exported to blueprint.mtl; keep the .obj and .mtl in the same folder.',
    '# UVs are procedural and use 1 texture tile per meter for wall/floor alignment tests.',
    '# Exact hidden coplanar faces between touching boxes are culled during export.',
    'mtllib blueprint.mtl',
    ''
  ];
  // six shared axis normals: 1 -Z, 2 +Z, 3 -Y, 4 +X, 5 +Y, 6 -X
  out.push('vn 0 0 -1', 'vn 0 0 1', 'vn 0 -1 0', 'vn 1 0 0', 'vn 0 1 0', 'vn -1 0 0', '');
  let vBase = 0, vtBase = 0, curMat = null;
  const allBoxes = groups.flatMap(g => g.boxes || []);
  const keyNum = v => rnd4(v);
  const faceKey = (b, face) => {
    if (face === 'wx0' || face === 'wx1') return `x|${keyNum(face === 'wx0' ? b.x0 : b.x1)}|${keyNum(b.y0)}|${keyNum(b.y1)}|${keyNum(b.z0)}|${keyNum(b.z1)}`;
    if (face === 'wy0' || face === 'wy1') return `y|${keyNum(face === 'wy0' ? b.y0 : b.y1)}|${keyNum(b.x0)}|${keyNum(b.x1)}|${keyNum(b.z0)}|${keyNum(b.z1)}`;
    return `z|${keyNum(face === 'bottom' ? b.z0 : b.z1)}|${keyNum(b.x0)}|${keyNum(b.x1)}|${keyNum(b.y0)}|${keyNum(b.y1)}`;
  };
  const oppositeFace = f => ({wx0:'wx1', wx1:'wx0', wy0:'wy1', wy1:'wy0', bottom:'top', top:'bottom'})[f];
  const faceCounts = new Map();
  for (const b of allBoxes){
    for (const f of ['wy1','wy0','bottom','wx0','top','wx1']){
      const k = f + '|' + faceKey(b, f);
      faceCounts.set(k, (faceCounts.get(k) || 0) + 1);
    }
  }
  const hiddenFace = (b, f) => (faceCounts.get(oppositeFace(f) + '|' + faceKey(b, f)) || 0) > 0;
  const useMat = mat => {
    mat = matName(mat);
    if (curMat !== mat){ out.push('usemtl ' + mat); curMat = mat; }
  };
  const emitFace = (mat, line) => { useMat(mat); out.push(line); };
  const emitBox = b => {
    // plan(x,y)+height(z) -> obj(X=-x, Y=z, Z=-y).
    // Negating X fixes Blender's left/right mirror while keeping top-view depth consistent.
    const X0 = -b.x1, X1 = -b.x0, Y0 = b.z0, Y1 = b.z1, Z0 = -b.y1, Z1 = -b.y0;
    out.push(
      `v ${rnd4(X0)} ${rnd4(Y0)} ${rnd4(Z0)}`, `v ${rnd4(X1)} ${rnd4(Y0)} ${rnd4(Z0)}`,
      `v ${rnd4(X1)} ${rnd4(Y1)} ${rnd4(Z0)}`, `v ${rnd4(X0)} ${rnd4(Y1)} ${rnd4(Z0)}`,
      `v ${rnd4(X0)} ${rnd4(Y0)} ${rnd4(Z1)}`, `v ${rnd4(X1)} ${rnd4(Y0)} ${rnd4(Z1)}`,
      `v ${rnd4(X1)} ${rnd4(Y1)} ${rnd4(Z1)}`, `v ${rnd4(X0)} ${rnd4(Y1)} ${rnd4(Z1)}`
    );
    const i = n => vBase + n, m = b.mats || faceMats('Interior_Plain_Concrete');
    const uv = (u, v) => [u / UV_METERS_PER_TILE, v / UV_METERS_PER_TILE];
    const faceUVs = face => {
      if (face === 'wy1') return [uv(b.x1,b.z0), uv(b.x1,b.z1), uv(b.x0,b.z1), uv(b.x0,b.z0)];
      if (face === 'wy0') return [uv(b.x1,b.z0), uv(b.x0,b.z0), uv(b.x0,b.z1), uv(b.x1,b.z1)];
      if (face === 'wx0') return [uv(b.y1,b.z0), uv(b.y1,b.z1), uv(b.y0,b.z1), uv(b.y0,b.z0)];
      if (face === 'wx1') return [uv(b.y1,b.z0), uv(b.y0,b.z0), uv(b.y0,b.z1), uv(b.y1,b.z1)];
      if (face === 'top') return [uv(b.x0,b.y1), uv(b.x1,b.y1), uv(b.x1,b.y0), uv(b.x0,b.y0)];
      return [uv(b.x1,b.y1), uv(b.x0,b.y1), uv(b.x0,b.y0), uv(b.x1,b.y0)];
    };
    const fLine = (verts, nIdx, uvs) => {
      const start = vtBase + 1;
      for (const t of uvs) out.push(`vt ${rnd4(t[0])} ${rnd4(t[1])}`);
      vtBase += uvs.length;
      return 'f ' + verts.map((vi, idx) => `${i(vi)}/${start + idx}/${nIdx}`).join(' ');
    };
    if (!hiddenFace(b, 'wy1')) emitFace(m.wy1, fLine([1,4,3,2], 1, faceUVs('wy1')));
    if (!hiddenFace(b, 'wy0')) emitFace(m.wy0, fLine([5,6,7,8], 2, faceUVs('wy0')));
    if (!hiddenFace(b, 'bottom')) emitFace(m.bottom, fLine([1,2,6,5], 3, faceUVs('bottom')));
    if (!hiddenFace(b, 'wx0')) emitFace(m.wx0, fLine([2,3,7,6], 4, faceUVs('wx0')));
    if (!hiddenFace(b, 'top')) emitFace(m.top, fLine([3,4,8,7], 5, faceUVs('top')));
    if (!hiddenFace(b, 'wx1')) emitFace(m.wx1, fLine([1,5,8,4], 6, faceUVs('wx1')));
    vBase += 8;
  };
  const emitPrism = pr => {
    for (const p of pr.pts) out.push(`v ${rnd4(-p.x)} ${rnd4(pr.z0)} ${rnd4(-p.y)}`);
    for (const p of pr.pts) out.push(`v ${rnd4(-p.x)} ${rnd4(pr.z1)} ${rnd4(-p.y)}`);
    const i = n => vBase + n;
    useMat(pr.mat || defaultMats.door);
    out.push(
      `f ${i(1)} ${i(2)} ${i(3)} ${i(4)}`,
      `f ${i(5)} ${i(8)} ${i(7)} ${i(6)}`,
      `f ${i(1)} ${i(5)} ${i(6)} ${i(2)}`,
      `f ${i(2)} ${i(6)} ${i(7)} ${i(3)}`,
      `f ${i(3)} ${i(7)} ${i(8)} ${i(4)}`,
      `f ${i(4)} ${i(8)} ${i(5)} ${i(1)}`
    );
    vBase += 8;
  };
  for (const g of groups){
    out.push('', 'o ' + g.name, 'g ' + g.name);
    for (const b of g.boxes) emitBox(b);
    for (const pr of (g.prisms || [])) emitPrism(pr);
  }
  const blob = new Blob([out.join('\n') + '\n'], {type: 'model/obj'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'blueprint.obj'; a.click();
  URL.revokeObjectURL(a.href);
  const mtlBlob = new Blob([buildMTL() + '\n'], {type: 'model/mtl'});
  const m = document.createElement('a');
  m.href = URL.createObjectURL(mtlBlob); m.download = 'blueprint.mtl'; m.click();
  URL.revokeObjectURL(m.href);
}
document.getElementById('btnObj').addEventListener('click', exportOBJ);
document.getElementById('btnPbr').addEventListener('click', exportPBRHelper);

/* ---------------- toolbar & floors ---------------- */
const TIPS = {
  wall: '<b>Wall:</b> drag to draw; overlaps are allowed for tracing · hover a wall and <b>Shift+drag the red handle</b> to pull out a room',
  interior: '<b>Half wall:</b> thin and waist-high (1 m) in 3D — for rails, counters, loft edges · Shift+drag the red handle extrudes a half-walled room',
  select: '<b>Select:</b> drag a wall to push it · drag an endpoint to lengthen · <b>Windows</b> toggles exterior-only windows and type buttons choose size · Del deletes',
  door: '<b>Door:</b> choose single/double, hover a wall, click to place · <b>R</b> flips swing · <b>F</b> flips hinge · 3D exports half-open at 45°',
  stairs: '<b>Stairs:</b> pick a type, click to place · <b>R</b> rotates 90°',
  cutout: '<b>Cutout:</b> drag a rectangle to open the floor · or just <b>click a ghosted staircase below</b> to cut its exact footprint',
  pillar: '<b>Pillar:</b> click grid intersections to place rectangular full-height support pillars · erase removes individual pillars',
  erase: '<b>Erase:</b> click a door/stair/cutout to remove just it · click a wall to remove that exact segment · exact duplicate shared walls open together · click a room floor to wipe the room + contents',
};
const stairTypesEl = document.getElementById('stairTypes');
const doorTypesEl = document.getElementById('doorTypes');
const windowTypesEl = document.getElementById('windowTypes');
function setTool(t){
  tool = t; sel = (t === 'select') ? sel : null; ghost = null; stairGhost = null; pillarGhost = null;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  stairTypesEl.classList.toggle('show', t === 'stairs');
  doorTypesEl.classList.toggle('show', t === 'door');
  cv.className = 'tool-' + t;
  tipEl.classList.remove('warn');
  tipEl.innerHTML = TIPS[t];
  syncButtons(); draw();
}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.querySelectorAll('.st').forEach(b => b.addEventListener('click', () => {
  stairType = b.dataset.st;
  document.querySelectorAll('.st').forEach(x => x.classList.toggle('active', x === b));
  if (stairGhost) stairGhost.type = stairType;
  draw();
}));
document.querySelector('.st[data-st="straight"]').classList.add('active');

document.querySelectorAll('.dt').forEach(b => b.addEventListener('click', () => {
  doorType = b.dataset.door;
  document.querySelectorAll('.dt').forEach(x => x.classList.toggle('active', x === b));
  if (ghost){ ghost.type = doorType; ghost.width = DOOR_TYPES[doorType].w; }
  draw();
}));
document.querySelector('.dt[data-door="single"]').classList.add('active');

document.querySelectorAll('.wt').forEach(b => b.addEventListener('click', () => {
  // This is the user's pending window size choice. Do not let syncButtons()
  // overwrite it just because a selected wall already has a different type.
  windowType = b.dataset.win;
  const w = walls.find(x => x.id === sel);
  if (w){
    if (!windowAllowedOnWall(w)){ warn('Windows are exterior-only and are skipped where another wall intersects the opening.'); syncButtons(); return; }
    pushUndo();
    w.windows = true;
    w.windowType = windowType;
    delete w.windowSpans; delete w.windowSlots; delete w.windowCount;
  }
  syncButtons(); draw();
}));
document.querySelector('.wt[data-win="standard"]').classList.add('active');


const btnWindows = document.getElementById('btnWindows');
function toggleWindows(){
  const w = walls.find(x => x.id === sel);
  if (!w) return;
  if (!windowAllowedOnWall(w)){ warn('Windows can only be added to exterior walls, not shared room-to-room walls.'); return; }
  pushUndo();
  w.windows = !w.windows;
  if (w.windows){
    w.windowType = windowType;
    delete w.windowSpans; delete w.windowSlots; delete w.windowCount;
  }
  syncButtons(); draw();
}
function selectedWallWindowTypeForUI(){
  const w = walls.find(x => x.id === sel);
  return (w && w.windows && w.windowType && WINDOW_TYPES[w.windowType]) ? w.windowType : windowType;
}
btnWindows.addEventListener('click', toggleWindows);

const btnSnap = document.getElementById('btnSnap');
function toggleSnap(){ snapOn = !snapOn; btnSnap.classList.toggle('active', snapOn); }
btnSnap.addEventListener('click', toggleSnap);
btnSnap.classList.add('active');

document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);

document.getElementById('btnClear').addEventListener('click', () => {
  if (!flWalls().length && !flRooms().length && !flStairs().length && !flCutouts().length && !flPillars().length) return;
  pushUndo();
  const keepDoorWalls = new Set(walls.filter(w => w.fl !== curFl).map(w => w.id));
  walls = walls.filter(w => w.fl !== curFl);
  rooms = rooms.filter(r => r.fl !== curFl);
  stairs = stairs.filter(s => s.fl !== curFl);
  cutouts = cutouts.filter(c => c.fl !== curFl);
  pillars = pillars.filter(p => p.fl !== curFl);
  doors = doors.filter(d => keepDoorWalls.has(d.wallId));
  sel = null;
  syncButtons(); draw();
});

/* floor selector */
const floorBtns = document.getElementById('floorBtns');
function buildFloorPanel(){
  floorBtns.innerHTML = '';
  for (let f = nFloors; f >= 1; f--){
    const b = document.createElement('button');
    b.textContent = 'F' + f;
    b.classList.toggle('cur', f === curFl);
    b.addEventListener('click', () => { curFl = f; sel = null; buildFloorPanel(); syncButtons(); draw(); });
    floorBtns.appendChild(b);
  }
  floorInd.textContent = 'F' + curFl;
}
document.getElementById('btnAddFloor').addEventListener('click', () => {
  if (nFloors >= 6) { warn('Prototype caps at 6 floors.'); return; }
  pushUndo();
  nFloors++; curFl = nFloors;
  buildFloorPanel(); draw();
});

document.getElementById('btnJson').addEventListener('click', () => {
  const data = {
    format: 'blueprint-plan', version: '0.3', units: 'meters',
    grid: GRID, floors: nFloors, floorHeight: FLOOR_H, floorThickness: FLOOR_T,
    wallThickness: {wall: WALL_T, halfWall: INT_T},
    halfWallHeight: HALF_H,
    windowTypes: WINDOW_TYPES,
    materials: MATERIALS, defaultMaterials: defaultMats, foundationTrimOn,
    doorTypes: DOOR_TYPES, door: {width: DOOR_W, doubleWidth: DOUBLE_DOOR_W, height: 2.1},
    stairTypes: STAIR_TYPES,
    walls, rooms: rooms.map(r => ({...r, area: polyArea(r.pts)})), doors, stairs, cutouts, pillars,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'blueprint.plan.json'; a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('btnPng').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png'); a.download = 'blueprint-F' + curFl + '.png'; a.click();
});

const paintTargetEl = document.getElementById('paintTarget');
const paintMaterialEl = document.getElementById('paintMaterial');
const btnApplyPaint = document.getElementById('btnApplyPaint');
const btnBaseTrim = document.getElementById('btnBaseTrim'); // removed in v0.3.8; kept as a null-safe migration hook
function initPaintControls(){
  for (const [key, t] of Object.entries(PAINT_TARGETS)){
    const opt = document.createElement('option'); opt.value = key; opt.textContent = t.label; paintTargetEl.appendChild(opt);
  }
  paintTargetEl.value = paintTarget;
  paintTargetEl.addEventListener('change', () => { paintTarget = paintTargetEl.value; fillPaintMaterials(); });
  paintMaterialEl.addEventListener('change', () => { defaultMats[paintTarget] = paintMaterialEl.value; });
  btnApplyPaint.addEventListener('click', applyPaint);
  if (btnBaseTrim) btnBaseTrim.addEventListener('click', () => { foundationTrimOn = !foundationTrimOn; btnBaseTrim.classList.toggle('active', foundationTrimOn); draw(); });
  fillPaintMaterials();
}
function fillPaintMaterials(){
  paintMaterialEl.innerHTML = '';
  const cats = PAINT_TARGETS[paintTarget].cats;
  for (const [key, m] of Object.entries(MATERIALS)){
    if (!m.cat.some(c => cats.includes(c))) continue;
    const opt = document.createElement('option'); opt.value = key; opt.textContent = m.label; paintMaterialEl.appendChild(opt);
  }
  paintMaterialEl.value = defaultMats[paintTarget];
}
function applyPaint(){
  const mat = paintMaterialEl.value;
  defaultMats[paintTarget] = mat;
  const w = walls.find(x => x.id === sel);
  const r = w ? rooms.find(x => x.id === w.roomId) : null;
  pushUndo();
  if ((paintTarget === 'exteriorWall' || paintTarget === 'interiorWall') && w) setWallMat(w, paintTarget, mat);
  else if (r && ['floor','ceiling','roof'].includes(paintTarget)) setRoomMat(r, paintTarget, mat);
  else defaultMats[paintTarget] = mat;
  warn(w || r ? 'Material applied to the selected part and set as the new default.' : 'Default material updated for new/exported geometry.');
  draw();
}

function syncButtons(){
  const w = walls.find(x => x.id === sel);
  const canWindow = !!w && windowAllowedOnWall(w);
  btnWindows.disabled = !canWindow;
  btnWindows.classList.toggle('active', !!(w && w.windows));
  windowTypesEl.classList.toggle('show', tool === 'select' && canWindow);
  const shownWindowType = selectedWallWindowTypeForUI();
  document.querySelectorAll('.wt').forEach(x => x.classList.toggle('active', x.dataset.win === shownWindowType));
  document.getElementById('btnUndo').disabled = !undoStack.length;
  document.getElementById('btnRedo').disabled = !redoStack.length;
}

/* ---------------- boot ---------------- */
initPaintControls();
setTool('wall');
buildFloorPanel();
resize();
</script>
